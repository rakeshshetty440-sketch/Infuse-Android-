name: Build Infuse Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate Infuse project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/infuse/player
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Infuse"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.infuse.player"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.infuse.player"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 3
                  versionName = "3.0"
              }

              buildFeatures {
                  compose = true
                  buildConfig = true
              }

              defaultConfig {
                  buildConfigField(
                      "String",
                      "TMDB_API_KEY",
                      "\\"${System.getenv("TMDB_API_KEY") ?: ""}\\""
                  )
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              implementation("androidx.lifecycle:lifecycle-runtime-compose:2.8.7")

              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-ui:1.5.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.5.1")
              implementation("androidx.media3:media3-exoplayer-dash:1.5.1")

              implementation("io.coil-kt:coil-compose:2.7.0")
              implementation("com.squareup.okhttp3:okhttp:4.12.0")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Infuse</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application
                  android:allowBackup="true"
                  android:label="Infuse"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/infuse/player/MainActivity.kt <<'EOF'
          package com.infuse.player

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.BackHandler
          import androidx.activity.compose.setContent
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.ArrowBack
          import androidx.compose.material.icons.filled.Close
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.runtime.saveable.rememberSaveable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextOverflow
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.compose.ui.window.Dialog
          import androidx.compose.ui.window.DialogProperties
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleEventObserver
          import androidx.lifecycle.compose.LocalLifecycleOwner
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MimeTypes
          import androidx.media3.common.Player
          import androidx.media3.common.TrackSelectionOverride
          import androidx.media3.common.Tracks
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView
          import coil.compose.AsyncImage
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.delay
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.net.URLEncoder
          import java.util.Locale
          import java.util.concurrent.TimeUnit

          private val BG = Color(0xFF090A0D)
          private val SURFACE = Color(0xFF17191E)
          private val MUTED = Color(0xFF9A9DA5)
          private val ACCENT = Color(0xFFFF7917)

          private data class MovieInfo(
              val title: String = "",
              val overview: String = "",
              val year: String = "",
              val rating: String = "",
              val poster: String? = null,
              val backdrop: String? = null,
              val genre: String = "",
              val mediaType: String = "movie"
          )

          private data class VideoEntry(
              val uri: Uri,
              val fileName: String,
              val info: MovieInfo = MovieInfo(),
              val position: Long = 0L,
              val duration: Long = 0L
          )

          private data class TrackChoice(
              val label: String,
              val group: Tracks.Group,
              val index: Int,
              val selected: Boolean
          )

          private val http = OkHttpClient.Builder()
              .connectTimeout(12, TimeUnit.SECONDS)
              .readTimeout(12, TimeUnit.SECONDS)
              .build()

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { InfuseApp() }
              }
          }

          @Composable
          private fun InfuseApp() {
              val context = LocalContext.current
              val prefs = remember {
                  context.getSharedPreferences("infuse_v3", Context.MODE_PRIVATE)
              }
              var library by remember { mutableStateOf(loadLibrary(prefs)) }
              var active by remember { mutableStateOf<VideoEntry?>(null) }
              var player by remember { mutableStateOf<ExoPlayer?>(null) }
              var tracks by remember { mutableStateOf(Tracks.EMPTY) }
              var selectedDetails by remember { mutableStateOf<VideoEntry?>(null) }
              var showAudio by rememberSaveable { mutableStateOf(false) }
              var showSubtitles by rememberSaveable { mutableStateOf(false) }
              var message by remember { mutableStateOf("") }
              var position by remember { mutableLongStateOf(0L) }
              var duration by remember { mutableLongStateOf(0L) }
              var refreshing by remember { mutableStateOf(false) }

              suspend fun enrich(entry: VideoEntry): VideoEntry {
                  if (BuildConfig.TMDB_API_KEY.isBlank()) return entry
                  val info = withContext(Dispatchers.IO) {
                      searchTmdb(entry.fileName, BuildConfig.TMDB_API_KEY)
                  }
                  return if (info != null) entry.copy(info = info) else entry
              }

              val videoPicker = rememberLauncherForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  if (uri == null) {
                      message = "No video selected."
                  } else {
                      try {
                          context.contentResolver.takePersistableUriPermission(
                              uri, Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )
                      } catch (_: Exception) {}
                      val name = displayName(context, uri)
                      val old = library.firstOrNull { it.uri == uri }
                      val entry = VideoEntry(
                          uri = uri,
                          fileName = name,
                          info = old?.info ?: MovieInfo(),
                          position = prefs.getLong("pos_${uri}", old?.position ?: 0L),
                          duration = prefs.getLong("dur_${uri}", old?.duration ?: 0L)
                      )
                      library = (library.filterNot { it.uri == uri } + entry)
                      saveLibrary(prefs, library)
                      message = "Added: $name"
                  }
              }

              val subtitlePicker = rememberLauncherForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  val exo = player
                  val entry = active
                  if (uri != null && exo != null && entry != null) {
                      try {
                          context.contentResolver.takePersistableUriPermission(
                              uri, Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )
                      } catch (_: Exception) {}
                      try {
                          val name = displayName(context, uri)
                          val subtitle = MediaItem.SubtitleConfiguration.Builder(uri)
                              .setMimeType(subtitleMime(name, context, uri))
                              .setLanguage("und")
                              .setLabel(name)
                              .setSelectionFlags(C.SELECTION_FLAG_DEFAULT)
                              .build()
                          val item = MediaItem.Builder()
                              .setUri(entry.uri)
                              .setSubtitleConfigurations(listOf(subtitle))
                              .build()
                          val at = exo.currentPosition
                          exo.setMediaItem(item, at)
                          exo.prepare()
                          exo.playWhenReady = true
                          exo.trackSelectionParameters =
                              exo.trackSelectionParameters.buildUpon()
                                  .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, false)
                                  .clearOverridesOfType(C.TRACK_TYPE_TEXT)
                                  .build()
                          message = "Subtitle added: $name"
                      } catch (e: Exception) {
                          message = "Subtitle error: ${e.message}"
                      }
                  }
              }

              fun closePlayer() {
                  val exo = player
                  val entry = active
                  if (exo != null && entry != null) {
                      savePosition(prefs, entry, exo.currentPosition, exo.duration)
                      exo.playWhenReady = false
                      exo.stop()
                      exo.release()
                  }
                  player = null
                  active = null
                  tracks = Tracks.EMPTY
                  position = 0L
                  duration = 0L
              }

              fun start(entry: VideoEntry) {
                  player?.release()
                  try {
                      val renderers = DefaultRenderersFactory(context)
                          .setExtensionRendererMode(
                              DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER
                          )
                          .setEnableDecoderFallback(true)
                      val exo = ExoPlayer.Builder(context)
                          .setRenderersFactory(renderers)
                          .build()
                      player = exo
                      active = entry
                      position = entry.position
                      duration = entry.duration
                      message = "Loading ${entry.fileName}"
                      exo.addListener(object : Player.Listener {
                          override fun onTracksChanged(newTracks: Tracks) {
                              tracks = newTracks
                          }
                          override fun onPlaybackStateChanged(state: Int) {
                              if (state == Player.STATE_READY) message = ""
                              if (state == Player.STATE_ENDED) {
                                  savePosition(prefs, entry, exo.duration, exo.duration)
                                  library = library.map {
                                      if (it.uri == entry.uri) it.copy(position = 0L) else it
                                  }
                                  saveLibrary(prefs, library)
                              }
                          }
                          override fun onPlayerError(error: androidx.media3.common.PlaybackException) {
                              message = "Playback failed: ${error.errorCodeName}"
                          }
                      })
                      exo.setMediaItem(
                          MediaItem.fromUri(entry.uri),
                          entry.position.coerceAtLeast(0L)
                      )
                      exo.prepare()
                      exo.playWhenReady = true
                  } catch (e: Exception) {
                      message = "Could not open video: ${e.message}"
                      player?.release()
                      player = null
                      active = null
                  }
              }

              // Save playback position while playing and when the app backgrounds.
              LaunchedEffect(player, active) {
                  while (player != null && active != null) {
                      delay(1500)
                      val exo = player
                      val entry = active
                      if (exo != null && entry != null) {
                          position = exo.currentPosition.coerceAtLeast(0L)
                          duration = exo.duration.coerceAtLeast(0L)
                          savePosition(prefs, entry, position, duration)
                          library = library.map {
                              if (it.uri == entry.uri) {
                                  it.copy(
                                      position = if (isComplete(position, duration)) 0L else position,
                                      duration = duration
                                  )
                              } else it
                          }
                          saveLibrary(prefs, library)
                      }
                  }
              }

              val lifecycleOwner = LocalLifecycleOwner.current
              DisposableEffect(lifecycleOwner, player, active) {
                  val observer = LifecycleEventObserver { _, event ->
                      if (event == Lifecycle.Event.ON_PAUSE) {
                          val exo = player
                          val entry = active
                          if (exo != null && entry != null) {
                              savePosition(prefs, entry, exo.currentPosition, exo.duration)
                              exo.pause()
                          }
                      }
                  }
                  lifecycleOwner.lifecycle.addObserver(observer)
                  onDispose { lifecycleOwner.lifecycle.removeObserver(observer) }
              }

              BackHandler(enabled = active != null) { closePlayer() }

              val audioChoices = remember(tracks) { getChoices(tracks, C.TRACK_TYPE_AUDIO) }
              val textChoices = remember(tracks) { getChoices(tracks, C.TRACK_TYPE_TEXT) }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = ACCENT,
                      background = BG,
                      surface = SURFACE
                  )
              ) {
                  Surface(Modifier.fillMaxSize(), color = BG) {
                      if (active == null) {
                          LibraryScreen(
                              library = library,
                              message = message,
                              onAdd = { videoPicker.launch(arrayOf("video/*")) },
                              onRefresh = {
                                  refreshing = true
                              },
                              onSelect = { selectedDetails = it },
                              onPlay = { start(it) }
                          )
                      } else {
                          PlayerScreen(
                              entry = active!!,
                              player = player,
                              position = position,
                              duration = duration,
                              audioCount = audioChoices.size,
                              subtitleCount = textChoices.size,
                              message = message,
                              onBack = { closePlayer() },
                              onAudio = { showAudio = true },
                              onSubs = { showSubtitles = true },
                              onExternalSubs = {
                                  subtitlePicker.launch(
                                      arrayOf(
                                          "application/x-subrip",
                                          "text/vtt",
                                          "text/plain",
                                          "application/octet-stream"
                                      )
                                  )
                              }
                          )
                      }

                      selectedDetails?.let { entry ->
                          MovieDetailsDialog(
                              entry = entry,
                              onDismiss = { selectedDetails = null },
                              onPlay = {
                                  selectedDetails = null
                                  start(entry)
                              }
                          )
                      }

                      if (showAudio) {
                          TrackDialog(
                              title = "Audio language",
                              choices = audioChoices,
                              onDismiss = { showAudio = false },
                              onOff = null,
                              onChoose = { choice ->
                                  player?.let { exo ->
                                      exo.trackSelectionParameters =
                                          exo.trackSelectionParameters.buildUpon()
                                              .setTrackTypeDisabled(C.TRACK_TYPE_AUDIO, false)
                                              .clearOverridesOfType(C.TRACK_TYPE_AUDIO)
                                              .addOverride(
                                                  TrackSelectionOverride(
                                                      choice.group.mediaTrackGroup,
                                                      listOf(choice.index)
                                                  )
                                              ).build()
                                  }
                                  showAudio = false
                              }
                          )
                      }

                      if (showSubtitles) {
                          TrackDialog(
                              title = "Subtitles",
                              choices = textChoices,
                              onDismiss = { showSubtitles = false },
                              onOff = {
                                  player?.let { exo ->
                                      exo.trackSelectionParameters =
                                          exo.trackSelectionParameters.buildUpon()
                                              .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)
                                              .clearOverridesOfType(C.TRACK_TYPE_TEXT)
                                              .build()
                                  }
                                  showSubtitles = false
                              },
                              onChoose = { choice ->
                                  player?.let { exo ->
                                      exo.trackSelectionParameters =
                                          exo.trackSelectionParameters.buildUpon()
                                              .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, false)
                                              .clearOverridesOfType(C.TRACK_TYPE_TEXT)
                                              .addOverride(
                                                  TrackSelectionOverride(
                                                      choice.group.mediaTrackGroup,
                                                      listOf(choice.index)
                                                  )
                                              ).build()
                                  }
                                  showSubtitles = false
                              }
                          )
                      }
                  }
              }

              LaunchedEffect(library.size) {
                  val needsMetadata = library.filter {
                      it.info.title.isBlank() && BuildConfig.TMDB_API_KEY.isNotBlank()
                  }
                  needsMetadata.forEach { item ->
                      val updated = enrich(item)
                      if (updated.info.title.isNotBlank()) {
                          library = library.map {
                              if (it.uri == item.uri) updated else it
                          }
                          saveLibrary(prefs, library)
                      }
                  }
              }

              LaunchedEffect(refreshing) {
                  if (refreshing) {
                      val snapshot = library
                      snapshot.forEach { item ->
                          val updated = enrich(item.copy(info = MovieInfo()))
                          if (updated.info.title.isNotBlank()) {
                              library = library.map {
                                  if (it.uri == item.uri) updated else it
                              }
                              saveLibrary(prefs, library)
                          }
                      }
                      refreshing = false
                      message = if (BuildConfig.TMDB_API_KEY.isBlank()) {
                          "Add TMDB_API_KEY in GitHub Secrets to load movie metadata."
                      } else {
                          "Library metadata refreshed."
                      }
                  }
              }
          }

          @Composable
          private fun LibraryScreen(
              library: List<VideoEntry>,
              message: String,
              onAdd: () -> Unit,
              onRefresh: () -> Unit,
              onSelect: (VideoEntry) -> Unit,
              onPlay: (VideoEntry) -> Unit
          ) {
              Column(
                  Modifier.fillMaxSize().background(BG)
              ) {
                  Row(
                      Modifier.fillMaxWidth().padding(start = 20.dp, end = 12.dp, top = 20.dp, bottom = 14.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Column(Modifier.weight(1f)) {
                          Text("Infuse", color = Color.White, fontSize = 30.sp, fontWeight = FontWeight.Bold)
                          Text("YOUR CINEMA LIBRARY", color = MUTED, fontSize = 10.sp, letterSpacing = 2.sp)
                      }
                      Button(
                          onClick = onAdd,
                          colors = ButtonDefaults.buttonColors(containerColor = ACCENT),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Icon(Icons.Default.Add, contentDescription = null)
                          Spacer(Modifier.width(5.dp))
                          Text("Open Video")
                      }
                      IconButton(onClick = onRefresh) {
                          Icon(Icons.Default.Refresh, contentDescription = "Refresh metadata", tint = Color.White)
                      }
                  }

                  if (message.isNotBlank()) {
                      Text(message, color = MUTED, fontSize = 12.sp, modifier = Modifier.padding(horizontal = 20.dp, vertical = 4.dp))
                  }

                  if (library.isEmpty()) {
                      Box(Modifier.fillMaxSize(), contentAlignment = Alignment.Center) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text("Your library is empty", color = Color.White, fontSize = 21.sp, fontWeight = FontWeight.SemiBold)
                              Spacer(Modifier.height(8.dp))
                              Text("Add a movie or TV episode to get started", color = MUTED, fontSize = 13.sp)
                              Spacer(Modifier.height(18.dp))
                              Button(onClick = onAdd, colors = ButtonDefaults.buttonColors(containerColor = ACCENT)) {
                                  Text("Choose Video")
                              }
                          }
                      }
                  } else {
                      val resume = library.filter { it.position > 5000L && !isComplete(it.position, it.duration) }
                      if (resume.isNotEmpty()) {
                          Text("Continue Watching", color = Color.White, fontSize = 19.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(start = 20.dp, top = 10.dp, bottom = 10.dp))
                          androidx.compose.foundation.lazy.LazyRow(
                              contentPadding = PaddingValues(horizontal = 20.dp),
                              horizontalArrangement = Arrangement.spacedBy(12.dp)
                          ) {
                              items(resume, key = { it.uri.toString() }) { item ->
                                  Column(Modifier.width(145.dp)) {
                                      Poster(item, Modifier.fillMaxWidth().height(190.dp).clickable { onPlay(item) })
                                      Text(item.info.title.ifBlank { item.fileName }, color = Color.White, maxLines = 1, overflow = TextOverflow.Ellipsis, fontSize = 12.sp)
                                      TextButton(onClick = { onPlay(item) }, contentPadding = PaddingValues(0.dp)) {
                                          Text("▶ Resume", color = ACCENT)
                                      }
                                  }
                              }
                          }
                      }

                      Text("All Videos  (${library.size})", color = Color.White, fontSize = 19.sp, fontWeight = FontWeight.Bold, modifier = Modifier.padding(start = 20.dp, top = 14.dp, bottom = 10.dp))

                      LazyVerticalGrid(
                          columns = GridCells.Adaptive(minSize = 112.dp),
                          contentPadding = PaddingValues(start = 16.dp, end = 16.dp, bottom = 24.dp),
                          horizontalArrangement = Arrangement.spacedBy(12.dp),
                          verticalArrangement = Arrangement.spacedBy(16.dp),
                          modifier = Modifier.weight(1f)
                      ) {
                          items(library, key = { it.uri.toString() }) { item ->
                              Column(Modifier.clickable { onSelect(item) }) {
                                  Poster(item, Modifier.fillMaxWidth().height(174.dp))
                                  Spacer(Modifier.height(7.dp))
                                  Text(
                                      item.info.title.ifBlank { item.fileName.substringBeforeLast(".") },
                                      color = Color.White,
                                      fontSize = 13.sp,
                                      fontWeight = FontWeight.SemiBold,
                                      maxLines = 2,
                                      overflow = TextOverflow.Ellipsis
                                  )
                                  val meta = listOf(item.info.year, item.info.rating.takeIf { it.isNotBlank() }?.let { "★ $it" }).filterNotNull().filter { it.isNotBlank() }.joinToString("  •  ")
                                  if (meta.isNotBlank()) Text(meta, color = MUTED, fontSize = 11.sp)
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          private fun Poster(entry: VideoEntry, modifier: Modifier = Modifier) {
              Box(modifier.clip(RoundedCornerShape(10.dp)).background(SURFACE)) {
                  val image = entry.info.poster?.let { "https://image.tmdb.org/t/p/w500$it" }
                  if (image != null) {
                      AsyncImage(
                          model = image,
                          contentDescription = entry.info.title,
                          contentScale = ContentScale.Crop,
                          modifier = Modifier.fillMaxSize()
                      )
                  } else {
                      Box(Modifier.fillMaxSize().background(Brush.linearGradient(listOf(Color(0xFF252A35), Color(0xFF111318)))), contentAlignment = Alignment.Center) {
                          Text("INFUSE", color = Color(0xFF777D89), fontWeight = FontWeight.Bold, letterSpacing = 2.sp)
                      }
                  }
              }
          }

          @Composable
          private fun MovieDetailsDialog(
              entry: VideoEntry,
              onDismiss: () -> Unit,
              onPlay: () -> Unit
          ) {
              Dialog(onDismissRequest = onDismiss, properties = DialogProperties(usePlatformDefaultWidth = false)) {
                  Column(
                      Modifier.fillMaxWidth(0.92f).clip(RoundedCornerShape(18.dp)).background(SURFACE)
                  ) {
                      Box(Modifier.fillMaxWidth().height(190.dp)) {
                          val backdrop = entry.info.backdrop?.let { "https://image.tmdb.org/t/p/w780$it" }
                          if (backdrop != null) {
                              AsyncImage(backdrop, contentDescription = null, contentScale = ContentScale.Crop, modifier = Modifier.fillMaxSize())
                          } else {
                              Poster(entry, Modifier.fillMaxSize())
                          }
                          IconButton(onClick = onDismiss, modifier = Modifier.align(Alignment.TopEnd)) {
                              Icon(Icons.Default.Close, contentDescription = "Close", tint = Color.White)
                          }
                      }
                      Column(Modifier.padding(18.dp)) {
                          Text(entry.info.title.ifBlank { entry.fileName }, color = Color.White, fontSize = 22.sp, fontWeight = FontWeight.Bold)
                          val line = listOf(entry.info.year, entry.info.genre, entry.info.rating.takeIf { it.isNotBlank() }?.let { "★ $it" }).filterNotNull().filter { it.isNotBlank() }.joinToString("  •  ")
                          if (line.isNotBlank()) Text(line, color = MUTED, fontSize = 12.sp, modifier = Modifier.padding(top = 5.dp))
                          Spacer(Modifier.height(12.dp))
                          Text(entry.info.overview.ifBlank { "Metadata not found. Check the filename or configure your TMDB API key." }, color = Color(0xFFE0E1E5), fontSize = 14.sp, lineHeight = 20.sp)
                          Spacer(Modifier.height(18.dp))
                          Button(onClick = onPlay, modifier = Modifier.fillMaxWidth(), colors = ButtonDefaults.buttonColors(containerColor = ACCENT)) {
                              Icon(Icons.Default.PlayArrow, contentDescription = null)
                              Spacer(Modifier.width(7.dp))
                              Text(if (entry.position > 5000L) "Resume" else "Play")
                          }
                      }
                  }
              }
          }

          @Composable
          private fun PlayerScreen(
              entry: VideoEntry,
              player: ExoPlayer?,
              position: Long,
              duration: Long,
              audioCount: Int,
              subtitleCount: Int,
              message: String,
              onBack: () -> Unit,
              onAudio: () -> Unit,
              onSubs: () -> Unit,
              onExternalSubs: () -> Unit
          ) {
              Column(Modifier.fillMaxSize().background(Color.Black)) {
                  Row(
                      Modifier.fillMaxWidth().background(SURFACE).padding(horizontal = 8.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      IconButton(onClick = onBack) {
                          Icon(Icons.Default.ArrowBack, contentDescription = "Back", tint = Color.White)
                      }
                      Text(entry.info.title.ifBlank { entry.fileName }, color = Color.White, maxLines = 1, overflow = TextOverflow.Ellipsis)
                  }
                  Box(Modifier.fillMaxWidth().weight(1f), contentAlignment = Alignment.Center) {
                      if (player != null) {
                          key(player) {
                              AndroidView(
                                  factory = { ctx -> PlayerView(ctx).apply { this.player = player; useController = true } },
                                  update = { it.player = player },
                                  modifier = Modifier.fillMaxSize()
                              )
                          }
                      }
                  }
                  Column(Modifier.fillMaxWidth().background(SURFACE).padding(14.dp)) {
                      Text("${clock(position)} / ${clock(duration)}", color = MUTED, fontSize = 12.sp)
                      Spacer(Modifier.height(10.dp))
                      Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                          OutlinedButton(onClick = onAudio, modifier = Modifier.weight(1f)) { Text("Audio ($audioCount)") }
                          OutlinedButton(onClick = onSubs, modifier = Modifier.weight(1f)) { Text("Subtitles ($subtitleCount)") }
                      }
                      OutlinedButton(onClick = onExternalSubs, modifier = Modifier.fillMaxWidth()) {
                          Text("Load external subtitle")
                      }
                      if (message.isNotBlank()) Text(message, color = MUTED, fontSize = 12.sp)
                  }
              }
          }

          @Composable
          private fun TrackDialog(
              title: String,
              choices: List<TrackChoice>,
              onDismiss: () -> Unit,
              onOff: (() -> Unit)?,
              onChoose: (TrackChoice) -> Unit
          ) {
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(title) },
                  text = {
                      Column {
                          if (onOff != null) {
                              TextButton(onClick = onOff) { Text("Off") }
                          }
                          if (choices.isEmpty()) {
                              Text("No tracks detected in this file.")
                          } else {
                              choices.forEach { choice ->
                                  Row(
                                      Modifier.fillMaxWidth().clickable { onChoose(choice) }.padding(vertical = 6.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      RadioButton(selected = choice.selected, onClick = { onChoose(choice) })
                                      Spacer(Modifier.width(8.dp))
                                      Text(choice.label)
                                  }
                              }
                          }
                      }
                  },
                  confirmButton = { TextButton(onClick = onDismiss) { Text("Close") } }
              )
          }

          private fun getChoices(tracks: Tracks, type: Int): List<TrackChoice> {
              val list = mutableListOf<TrackChoice>()
              tracks.groups.filter { it.type == type }.forEach { group ->
                  for (i in 0 until group.length) {
                      val format = group.getTrackFormat(i)
                      val lang = format.language?.takeIf { it != "und" && it.isNotBlank() }
                          ?.let { Locale.forLanguageTag(it).getDisplayLanguage() }
                      val label = format.label?.takeIf { it.isNotBlank() }
                          ?: lang
                          ?: if (type == C.TRACK_TYPE_AUDIO) "Audio track ${i + 1}" else "Subtitle ${i + 1}"
                      list.add(TrackChoice(label, group, i, group.isTrackSelected(i)))
                  }
              }
              return list
          }

          private suspend fun searchTmdb(fileName: String, apiKey: String): MovieInfo? {
              val cleaned = fileName
                  .substringBeforeLast(".")
                  .replace(Regex("[._]"), " ")
                  .replace(Regex("\\b(1080p|720p|2160p|4k|bluray|web-dl|webrip|hdtv|x264|x265|hevc|aac|dts)\\b", RegexOption.IGNORE_CASE), " ")
                  .replace(Regex("\\s+"), " ")
                  .trim()
              if (cleaned.isBlank()) return null
              val year = Regex("(19\\d{2}|20\\d{2})").find(cleaned)?.value
              val query = URLEncoder.encode(cleaned, "UTF-8")
              val url = "https://api.themoviedb.org/3/search/multi?api_key=$apiKey&query=$query"
              return try {
                  withContext(Dispatchers.IO) {
                      val request = Request.Builder().url(url).get().build()
                      http.newCall(request).execute().use { response ->
                          if (!response.isSuccessful) return@withContext null
                          val root = JSONObject(response.body?.string() ?: return@withContext null)
                          val results = root.optJSONArray("results") ?: return@withContext null
                          var best: JSONObject? = null
                          for (i in 0 until results.length()) {
                              val candidate = results.optJSONObject(i) ?: continue
                              val type = candidate.optString("media_type")
                              if (type != "movie" && type != "tv") continue
                              val title = candidate.optString(if (type == "movie") "title" else "name")
                              if (title.isBlank()) continue
                              if (best == null) best = candidate
                              if (year != null) {
                                  val date = candidate.optString(if (type == "movie") "release_date" else "first_air_date")
                                  if (date.startsWith(year)) {
                                      best = candidate
                                      break
                                  }
                              }
                          }
                          val item = best ?: return@withContext null
                          val type = item.optString("media_type", "movie")
                          val title = item.optString(if (type == "movie") "title" else "name")
                          val date = item.optString(if (type == "movie") "release_date" else "first_air_date")
                          MovieInfo(
                              title = title,
                              overview = item.optString("overview"),
                              year = date.take(4),
                              rating = if (item.has("vote_average")) String.format(Locale.US, "%.1f", item.optDouble("vote_average")) else "",
                              poster = item.optString("poster_path").takeIf { it.isNotBlank() && it != "null" },
                              backdrop = item.optString("backdrop_path").takeIf { it.isNotBlank() && it != "null" },
                              mediaType = type
                          )
                      }
                  }
              } catch (_: Exception) {
                  null
              }
          }

          private fun subtitleMime(name: String, context: Context, uri: Uri): String {
              return when (name.substringAfterLast('.', "").lowercase(Locale.ROOT)) {
                  "srt" -> MimeTypes.APPLICATION_SUBRIP
                  "vtt" -> MimeTypes.TEXT_VTT
                  "ass", "ssa" -> MimeTypes.TEXT_SSA
                  "ttml", "xml" -> MimeTypes.APPLICATION_TTML
                  else -> when (context.contentResolver.getType(uri)) {
                      "text/vtt" -> MimeTypes.TEXT_VTT
                      "application/ttml+xml" -> MimeTypes.APPLICATION_TTML
                      else -> MimeTypes.APPLICATION_SUBRIP
                  }
              }
          }

          private fun displayName(context: Context, uri: Uri): String {
              var name = uri.lastPathSegment ?: "Video"
              try {
                  context.contentResolver.query(
                      uri,
                      arrayOf(android.provider.OpenableColumns.DISPLAY_NAME),
                      null, null, null
                  )?.use { cursor ->
                      if (cursor.moveToFirst()) {
                          val index = cursor.getColumnIndex(android.provider.OpenableColumns.DISPLAY_NAME)
                          if (index >= 0) name = cursor.getString(index) ?: name
                      }
                  }
              } catch (_: Exception) {}
              return name
          }

          private fun loadLibrary(prefs: android.content.SharedPreferences): List<VideoEntry> {
              val raw = prefs.getString("library", null) ?: return emptyList()
              return raw.split("\n").mapNotNull { line ->
                  val parts = line.split("|")
                  if (parts.size < 2) return@mapNotNull null
                  try {
                      val uri = Uri.parse(Uri.decode(parts[0]))
                      val name = Uri.decode(parts[1])
                      val info = if (parts.size >= 8) {
                          MovieInfo(
                              title = Uri.decode(parts[2]),
                              overview = Uri.decode(parts[3]),
                              year = Uri.decode(parts[4]),
                              rating = Uri.decode(parts[5]),
                              poster = Uri.decode(parts[6]).takeIf { it.isNotBlank() },
                              backdrop = Uri.decode(parts[7]).takeIf { it.isNotBlank() },
                              genre = if (parts.size > 8) Uri.decode(parts[8]) else ""
                          )
                      } else MovieInfo()
                      VideoEntry(
                          uri = uri,
                          fileName = name,
                          info = info,
                          position = prefs.getLong("pos_${uri}", 0L),
                          duration = prefs.getLong("dur_${uri}", 0L)
                      )
                  } catch (_: Exception) { null }
              }
          }

          private fun saveLibrary(prefs: android.content.SharedPreferences, items: List<VideoEntry>) {
              val raw = items.joinToString("\n") { item ->
                  listOf(
                      Uri.encode(item.uri.toString()),
                      Uri.encode(item.fileName),
                      Uri.encode(item.info.title),
                      Uri.encode(item.info.overview),
                      Uri.encode(item.info.year),
                      Uri.encode(item.info.rating),
                      Uri.encode(item.info.poster ?: ""),
                      Uri.encode(item.info.backdrop ?: ""),
                      Uri.encode(item.info.genre)
                  ).joinToString("|")
              }
              prefs.edit().putString("library", raw).apply()
          }

          private fun savePosition(
              prefs: android.content.SharedPreferences,
              entry: VideoEntry,
              position: Long,
              duration: Long
          ) {
              prefs.edit()
                  .putLong("pos_${entry.uri}", if (isComplete(position, duration)) 0L else position.coerceAtLeast(0L))
                  .putLong("dur_${entry.uri}", duration.coerceAtLeast(0L))
                  .apply()
          }

          private fun isComplete(position: Long, duration: Long): Boolean =
              duration > 0L && position >= duration * 0.92

          private fun clock(ms: Long): String {
              if (ms <= 0L) return "00:00"
              val sec = ms / 1000
              val h = sec / 3600
              val m = (sec % 3600) / 60
              val s = sec % 60
              return if (h > 0) "%02d:%02d:%02d".format(h, m, s)
              else "%02d:%02d".format(m, s)
          }
