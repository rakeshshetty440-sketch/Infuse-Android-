
name: Build Infuse Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Generate complete Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/infuse/player
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Infuse"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.infuse.player"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.infuse.player"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 2
                  versionName = "2.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")

              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-ui:1.5.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.5.1")
              implementation("androidx.media3:media3-exoplayer-dash:1.5.1")
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Infuse</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:label="Infuse"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/infuse/player/MainActivity.kt <<'EOF'
          package com.infuse.player

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.ArrowBack
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.runtime.saveable.rememberSaveable
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MimeTypes
          import androidx.media3.common.Player
          import androidx.media3.common.TrackSelectionOverride
          import androidx.media3.common.Tracks
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView
          import kotlinx.coroutines.delay
          import java.util.Locale

          private val BG = Color(0xFF0B0C0F)
          private val PANEL = Color(0xFF1B1D22)
          private val ORANGE = Color(0xFFFF790F)

          private data class VideoFile(
              val uri: Uri,
              val name: String,
              val position: Long = 0L,
              val duration: Long = 0L
          )

          private data class TrackOption(
              val title: String,
              val group: Tracks.Group,
              val index: Int,
              val selected: Boolean
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent { InfuseApp() }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          private fun InfuseApp() {
              val context = LocalContext.current
              val prefs = remember {
                  context.getSharedPreferences("infuse_library", Context.MODE_PRIVATE)
              }

              var library by remember {
                  mutableStateOf(loadLibrary(prefs))
              }
              var currentVideo by remember {
                  mutableStateOf<VideoFile?>(null)
              }
              var player by remember {
                  mutableStateOf<ExoPlayer?>(null)
              }
              var tracks by remember {
                  mutableStateOf(Tracks.EMPTY)
              }
              var showAudio by rememberSaveable { mutableStateOf(false) }
              var showSubtitles by rememberSaveable { mutableStateOf(false) }
              var statusMessage by remember {
                  mutableStateOf("Select Open Video to add a video.")
              }
              var currentPosition by remember {
                  mutableLongStateOf(0L)
              }
              var currentDuration by remember {
                  mutableLongStateOf(0L)
              }
              var isPlaying by remember {
                  mutableStateOf(false)
              }

              // Use OpenDocument so Android returns one selected video URI.
              val videoPicker = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.OpenDocument()
              ) { uri ->
                  if (uri == null) {
                      statusMessage = "No video was selected."
                  } else {
                      try {
                          context.contentResolver.takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )

                          val name = displayName(context, uri)
                          val existing = library.firstOrNull {
                              it.uri.toString() == uri.toString()
                          }

                          val savedPosition = prefs.getLong(
                              "position_${uri}",
                              existing?.position ?: 0L
                          )
                          val savedDuration = prefs.getLong(
                              "duration_${uri}",
                              existing?.duration ?: 0L
                          )

                          val imported = VideoFile(
                              uri = uri,
                              name = name,
                              position = savedPosition,
                              duration = savedDuration
                          )

                          library = library.filterNot {
                              it.uri.toString() == uri.toString()
                          } + imported

                          saveLibrary(prefs, library)
                          statusMessage = "Added successfully: $name"

                          Toast.makeText(
                              context,
                              "Video added to Infuse",
                              Toast.LENGTH_SHORT
                          ).show()

                      } catch (error: Exception) {
                          statusMessage =
                              "Import failed: ${error.localizedMessage ?: "Unknown error"}"
                          Toast.makeText(
                              context,
                              statusMessage,
                              Toast.LENGTH_LONG
                          ).show()
                      }
                  }
              }

              val subtitlePicker = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.OpenDocument()
              ) { uri ->
                  val activePlayer = player
                  val video = currentVideo

                  if (uri == null) {
                      statusMessage = "No subtitle selected."
                  } else if (activePlayer != null && video != null) {
                      try {
                          context.contentResolver.takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )
                      } catch (_: Exception) {
                      }

                      try {
                          val name = displayName(context, uri)
                          val mime = subtitleMimeType(name, context, uri)

                          val subtitle = MediaItem.SubtitleConfiguration.Builder(uri)
                              .setMimeType(mime)
                              .setLanguage("und")
                              .setLabel(name)
                              .setSelectionFlags(C.SELECTION_FLAG_DEFAULT)
                              .build()

                          val position = activePlayer.currentPosition

                          val mediaItem = MediaItem.Builder()
                              .setUri(video.uri)
                              .setSubtitleConfigurations(listOf(subtitle))
                              .build()

                          activePlayer.setMediaItem(mediaItem, position)
                          activePlayer.prepare()
                          activePlayer.playWhenReady = true

                          activePlayer.trackSelectionParameters =
                              activePlayer.trackSelectionParameters
                                  .buildUpon()
                                  .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, false)
                                  .clearOverridesOfType(C.TRACK_TYPE_TEXT)
                                  .build()

                          statusMessage = "Subtitle loaded: $name"
                      } catch (error: Exception) {
                          statusMessage =
                              "Subtitle error: ${error.localizedMessage ?: "Unsupported file"}"
                      }
                  }
              }

              fun releasePlayer() {
                  val active = player
                  val video = currentVideo

                  if (active != null && video != null) {
                      saveProgress(
                          prefs,
                          video,
                          active.currentPosition,
                          active.duration
                      )
                      active.release()
                  }

                  player = null
                  currentVideo = null
                  tracks = Tracks.EMPTY
                  isPlaying = false
              }

              fun startVideo(video: VideoFile) {
                  player?.release()

                  try {
                      val renderers = DefaultRenderersFactory(context)
                          .setExtensionRendererMode(
                              DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER
                          )
                          .setEnableDecoderFallback(true)

                      val exo = ExoPlayer.Builder(context)
                          .setRenderersFactory(renderers)
                          .build()

                      player = exo
                      currentVideo = video
                      currentPosition = video.position
                      currentDuration = video.duration
                      statusMessage = "Loading ${video.name}"

                      exo.addListener(object : Player.Listener {
                          override fun onTracksChanged(newTracks: Tracks) {
                              tracks = newTracks
                          }

                          override fun onIsPlayingChanged(playing: Boolean) {
                              isPlaying = playing
                          }

                          override fun onPlaybackStateChanged(state: Int) {
                              if (state == Player.STATE_READY) {
                                  statusMessage = ""
                              }

                              if (state == Player.STATE_ENDED) {
                                  saveProgress(
                                      prefs,
                                      video,
                                      exo.duration,
                                      exo.duration
                                  )

                                  library = library.map {
                                      if (it.uri == video.uri) {
                                          it.copy(position = 0L)
                                      } else it
                                  }
                                  saveLibrary(prefs, library)
                              }
                          }

                          override fun onPlayerError(
                              error: androidx.media3.common.PlaybackException
                          ) {
                              statusMessage =
                                  "Playback error: ${error.errorCodeName}"
                          }
                      })

                      exo.setMediaItem(
                          MediaItem.fromUri(video.uri),
                          video.position.coerceAtLeast(0L)
                      )
                      exo.prepare()
                      exo.playWhenReady = true

                  } catch (error: Exception) {
                      statusMessage =
                          "Cannot open video: ${error.localizedMessage ?: "Unknown error"}"
                      player?.release()
                      player = null
                      currentVideo = null
                  }
              }

              // Save position every two seconds and update the library.
              LaunchedEffect(player, currentVideo) {
                  while (player != null && currentVideo != null) {
                      delay(2000)

                      val active = player
                      val video = currentVideo

                      if (active != null && video != null) {
                          val position = active.currentPosition.coerceAtLeast(0L)
                          val duration = active.duration.coerceAtLeast(0L)

                          currentPosition = position
                          currentDuration = duration

                          saveProgress(prefs, video, position, duration)

                          library = library.map {
                              if (it.uri == video.uri) {
                                  it.copy(
                                      position = if (
                                          duration > 0L &&
                                          position >= duration * 0.92
                                      ) 0L else position,
                                      duration = duration
                                  )
                              } else it
                          }
                          saveLibrary(prefs, library)
                      }
                  }
              }

              val audioOptions = remember(tracks) {
                  getTrackOptions(tracks, C.TRACK_TYPE_AUDIO)
              }

              val subtitleOptions = remember(tracks) {
                  getTrackOptions(tracks, C.TRACK_TYPE_TEXT)
              }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = ORANGE,
                      background = BG,
                      surface = PANEL
                  )
              ) {
                  Surface(
                      modifier = Modifier.fillMaxSize(),
                      color = BG
                  ) {
                      if (currentVideo == null) {
                          LibraryScreen(
                              library = library,
                              statusMessage = statusMessage,
                              onAdd = {
                                  statusMessage = "Opening video picker..."
                                  videoPicker.launch(arrayOf("video/*"))
                              },
                              onPlay = { startVideo(it) },
                              onRemove = { video ->
                                  library = library.filterNot {
                                      it.uri == video.uri
                                  }
                                  saveLibrary(prefs, library)
                                  prefs.edit()
                                      .remove("position_${video.uri}")
                                      .remove("duration_${video.uri}")
                                      .apply()
                                  statusMessage = "Video removed."
                              }
                          )
                      } else {
                          PlayerScreen(
                              video = currentVideo!!,
                              player = player,
                              audioCount = audioOptions.size,
                              subtitleCount = subtitleOptions.size,
                              currentPosition = currentPosition,
                              currentDuration = currentDuration,
                              statusMessage = statusMessage,
                              onBack = { releasePlayer() },
                              onAudio = { showAudio = true },
                              onSubtitles = { showSubtitles = true },
                              onAddSubtitle = {
                                  subtitlePicker.launch(
                                      arrayOf(
                                          "application/x-subrip",
                                          "text/vtt",
                                          "text/plain",
                                          "application/octet-stream"
                                      )
                                  )
                              }
                          )
                      }

                      if (showAudio) {
                          TrackDialog(
                              title = "Select audio language",
                              options = audioOptions,
                              onDismiss = { showAudio = false },
                              onOff = null,
                              onSelect = { option ->
                                  player?.let { exo ->
                                      exo.trackSelectionParameters =
                                          exo.trackSelectionParameters
                                              .buildUpon()
                                              .setTrackTypeDisabled(
                                                  C.TRACK_TYPE_AUDIO,
                                                  false
                                              )
                                              .clearOverridesOfType(
                                                  C.TRACK_TYPE_AUDIO
                                              )
                                              .addOverride(
                                                  TrackSelectionOverride(
                                                      option.group.mediaTrackGroup,
                                                      listOf(option.index)
                                                  )
                                              )
                                              .build()
                                  }
                                  showAudio = false
                              }
                          )
                      }

                      if (showSubtitles) {
                          TrackDialog(
                              title = "Select subtitles",
                              options = subtitleOptions,
                              onDismiss = { showSubtitles = false },
                              onOff = {
                                  player?.let { exo ->
                                      exo.trackSelectionParameters =
                                          exo.trackSelectionParameters
                                              .buildUpon()
                                              .setTrackTypeDisabled(
                                                  C.TRACK_TYPE_TEXT,
                                                  true
                                              )
                                              .clearOverridesOfType(
                                                  C.TRACK_TYPE_TEXT
                                              )
                                              .build()
                                  }
                                  showSubtitles = false
                              },
                              onSelect = { option ->
                                  player?.let { exo ->
                                      exo.trackSelectionParameters =
                                          exo.trackSelectionParameters
                                              .buildUpon()
                                              .setTrackTypeDisabled(
                                                  C.TRACK_TYPE_TEXT,
                                                  false
                                              )
                                              .clearOverridesOfType(
                                                  C.TRACK_TYPE_TEXT
                                              )
                                              .addOverride(
                                                  TrackSelectionOverride(
                                                      option.group.mediaTrackGroup,
                                                      listOf(option.index)
                                                  )
                                              )
                                              .build()
                                  }
                                  showSubtitles = false
                              }
                          )
                      }
                  }
              }
          }

          @Composable
          private fun LibraryScreen(
              library: List<VideoFile>,
              statusMessage: String,
              onAdd: () -> Unit,
              onPlay: (VideoFile) -> Unit,
              onRemove: (VideoFile) -> Unit
          ) {
              val continueWatching = library.filter {
                  it.position > 5000L &&
                  (it.duration <= 0L || it.position < it.duration * 0.92)
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(BG)
                      .padding(18.dp)
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      Column {
                          Text(
                              "Infuse",
                              color = Color.White,
                              fontSize = 30.sp,
                              fontWeight = FontWeight.Bold
                          )
                          Text(
                              "PRO v3.1",
                              color = ORANGE,
                              fontSize = 12.sp
                          )
                      }

                      Button(
                          onClick = onAdd,
                          colors = ButtonDefaults.buttonColors(
                              containerColor = ORANGE
                          )
                      ) {
                          Icon(
                              Icons.Default.Add,
                              contentDescription = null
                          )
                          Spacer(Modifier.width(5.dp))
                          Text("Open Video")
                      }
                  }

                  Spacer(Modifier.height(18.dp))

                  HorizontalDivider(color = Color.DarkGray)

                  Spacer(Modifier.height(14.dp))

                  Text(
                      "All Videos (${library.size})",
                      color = Color.White,
                      fontSize = 20.sp,
                      fontWeight = FontWeight.SemiBold
                  )

                  if (statusMessage.isNotBlank()) {
                      Spacer(Modifier.height(8.dp))
                      Text(
                          statusMessage,
                          color = Color(0xFFB7BBC4),
                          fontSize = 13.sp
                      )
                  }

                  Spacer(Modifier.height(14.dp))

                  if (continueWatching.isNotEmpty()) {
                      Text(
                          "Continue Watching",
                          color = Color.White,
                          fontSize = 19.sp,
                          fontWeight = FontWeight.Bold
                      )

                      Spacer(Modifier.height(8.dp))

                      continueWatching.forEach { video ->
                          VideoCard(
                              video = video,
                              isResume = true,
                              onPlay = { onPlay(video) },
                              onRemove = { onRemove(video) }
                          )
                          Spacer(Modifier.height(10.dp))
                      }
                  }

                  Text(
                      "My Library",
                      color = Color.White,
                      fontSize = 19.sp,
                      fontWeight = FontWeight.Bold
                  )

                  Spacer(Modifier.height(10.dp))

                  if (library.isEmpty()) {
                      Box(
                          modifier = Modifier.fillMaxSize(),
                          contentAlignment = Alignment.Center
                      ) {
                          Column(
                              horizontalAlignment = Alignment.CenterHorizontally
                          ) {
                              Text(
                                  "Your library is empty",
                                  color = Color.White,
                                  fontSize = 18.sp
                              )
                              Spacer(Modifier.height(8.dp))
                              Text(
                                  "Tap Open Video and select a video file.",
                                  color = Color.Gray
                              )
                              Spacer(Modifier.height(18.dp))
                              Button(
                                  onClick = onAdd,
                                  colors = ButtonDefaults.buttonColors(
                                      containerColor = ORANGE
                                  )
                              ) {
                                  Text("Choose Video")
                              }
                          }
                      }
                  } else {
                      LazyColumn(
                          modifier = Modifier.weight(1f),
                          verticalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          items(
                              library,
                              key = { it.uri.toString() }
                          ) { video ->
                              VideoCard(
                                  video = video,
                                  isResume = false,
                                  onPlay = { onPlay(video) },
                                  onRemove = { onRemove(video) }
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          private fun VideoCard(
              video: VideoFile,
              isResume: Boolean,
              onPlay: () -> Unit,
              onRemove: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(PANEL, RoundedCornerShape(14.dp))
                      .padding(14.dp)
              ) {
                  Row(
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Box(
                          modifier = Modifier
                              .size(48.dp)
                              .background(
                                  Color(0xFF30343B),
                                  RoundedCornerShape(10.dp)
                              ),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(
                              Icons.Default.PlayArrow,
                              contentDescription = null,
                              tint = Color.White
                          )
                      }

                      Spacer(Modifier.width(12.dp))

                      Column(Modifier.weight(1f)) {
                          Text(
                              video.name,
                              color = Color.White,
                              fontWeight = FontWeight.SemiBold,
                              maxLines = 2
                          )

                          if (isResume) {
                              Text(
                                  "Continue from ${formatTime(video.position)}",
                                  color = Color.Gray,
                                  fontSize = 12.sp
                              )
                          }
                      }

                      TextButton(onClick = onRemove) {
                          Text("Remove", color = Color.Gray)
                      }
                  }

                  if (video.duration > 0L && isResume) {
                      Spacer(Modifier.height(10.dp))
                      LinearProgressIndicator(
                          progress = {
                              (video.position.toFloat() /
                                  video.duration.toFloat()).coerceIn(0f, 1f)
                          },
                          modifier = Modifier.fillMaxWidth(),
                          color = ORANGE,
                          trackColor = Color.DarkGray
                      )
                  }

                  Spacer(Modifier.height(8.dp))

                  Button(
                      onClick = onPlay,
                      modifier = Modifier.fillMaxWidth(),
                      colors = ButtonDefaults.buttonColors(
                          containerColor = ORANGE
                      )
                  ) {
                      Icon(
                          Icons.Default.PlayArrow,
                          contentDescription = null
                      )
                      Spacer(Modifier.width(6.dp))
                      Text(if (isResume) "Resume" else "Play")
                  }
              }
          }

          @Composable
          private fun PlayerScreen(
              video: VideoFile,
              player: ExoPlayer?,
              audioCount: Int,
              subtitleCount: Int,
              currentPosition: Long,
              currentDuration: Long,
              statusMessage: String,
              onBack: () -> Unit,
              onAudio: () -> Unit,
              onSubtitles: () -> Unit,
              onAddSubtitle: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.Black)
              ) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(PANEL)
                          .padding(horizontal = 8.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      IconButton(onClick = onBack) {
                          Icon(
                              Icons.Default.ArrowBack,
                              contentDescription = "Back",
                              tint = Color.White
                          )
                      }

                      Text(
                          video.name,
                          color = Color.White,
                          modifier = Modifier.weight(1f),
                          maxLines = 1
                      )
                  }

                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f),
                      contentAlignment = Alignment.Center
                  ) {
                      if (player != null) {
                          key(player) {
                              AndroidView(
                                  factory = { ctx ->
                                      PlayerView(ctx).apply {
                                          this.player = player
                                          useController = true
                                      }
                                  },
                                  update = { view ->
                                      view.player = player
                                  },
                                  modifier = Modifier.fillMaxSize()
                              )
                          }
                      }
                  }

                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(PANEL)
                          .padding(14.dp)
                  ) {
                      Text(
                          video.name,
                          color = Color.White,
                          fontWeight = FontWeight.Bold
                      )

                      Spacer(Modifier.height(5.dp))

                      Text(
                          "${formatTime(currentPosition)} / ${formatTime(currentDuration)}",
                          color = Color.Gray,
                          fontSize = 12.sp
                      )

                      Spacer(Modifier.height(12.dp))

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          OutlinedButton(
                              onClick = onAudio,
                              modifier = Modifier.weight(1f)
                          ) {
                              Text("Audio ($audioCount)")
                          }

                          OutlinedButton(
                              onClick = onSubtitles,
                              modifier = Modifier.weight(1f)
                          ) {
                              Text("Subtitles ($subtitleCount)")
                          }
                      }

                      Spacer(Modifier.height(6.dp))

                      OutlinedButton(
                          onClick = onAddSubtitle,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text("Add external subtitle file")
                      }

                      if (statusMessage.isNotBlank()) {
                          Spacer(Modifier.height(5.dp))
                          Text(
                              statusMessage,
                              color = Color(0xFF8AB4F8),
                              fontSize = 12.sp
                          )
                      }
                  }
              }
          }

          @Composable
          private fun TrackDialog(
              title: String,
              options: List<TrackOption>,
              onDismiss: () -> Unit,
              onOff: (() -> Unit)?,
              onSelect: (TrackOption) -> Unit
          ) {
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(title) },
                  text = {
                      Column {
                          if (onOff != null) {
                              TextButton(
                                  onClick = onOff,
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("Turn subtitles off")
                              }
                          }

                          if (options.isEmpty()) {
                              Text(
                                  "No tracks detected in this video.",
                                  color = Color.Gray
                              )
                          } else {
                              options.forEach { option ->
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clickable { onSelect(option) }
                                          .padding(vertical = 8.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      RadioButton(
                                          selected = option.selected,
                                          onClick = { onSelect(option) }
                                      )
                                      Spacer(Modifier.width(8.dp))
                                      Text(option.title)
                                  }
                              }
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(onClick = onDismiss) {
                          Text("Close")
                      }
                  }
              )
          }

          private fun getTrackOptions(
              tracks: Tracks,
              type: Int
          ): List<TrackOption> {
              val result = mutableListOf<TrackOption>()

              for (group in tracks.groups) {
                  if (group.type != type) continue

                  for (index in 0 until group.length) {
                      val format = group.getTrackFormat(index)

                      val language = format.language
                          ?.takeIf { it.isNotBlank() && it != "und" }
                          ?.let {
                              Locale.forLanguageTag(it).getDisplayLanguage()
                          }

                      val label = format.label
                          ?.takeIf { it.isNotBlank() }
                          ?: language
                          ?: if (type == C.TRACK_TYPE_AUDIO) {
                              "Audio ${index + 1}"
                          } else {
                              "Subtitle ${index + 1}"
                          }

                      result.add(
                          TrackOption(
                              title = label,
                              group = group,
                              index = index,
                              selected = group.isTrackSelected(index)
                          )
                      )
                  }
              }

              return result
          }

          private fun subtitleMimeType(
              name: String,
              context: Context,
              uri: Uri
          ): String {
              return when (
                  name.substringAfterLast('.', "").lowercase(Locale.ROOT)
              ) {
                  "srt" -> MimeTypes.APPLICATION_SUBRIP
                  "vtt" -> MimeTypes.TEXT_VTT
                  "ass", "ssa" -> MimeTypes.TEXT_SSA
                  "ttml", "xml" -> MimeTypes.APPLICATION_TTML
                  else -> when (context.contentResolver.getType(uri)) {
                      "text/vtt" -> MimeTypes.TEXT_VTT
                      "application/ttml+xml" -> MimeTypes.APPLICATION_TTML
                      else -> MimeTypes.APPLICATION_SUBRIP
                  }
              }
          }

          private fun displayName(context: Context, uri: Uri): String {
              var name = uri.lastPathSegment ?: "Video"

              try {
                  context.contentResolver.query(
                      uri,
                      arrayOf(android.provider.OpenableColumns.DISPLAY_NAME),
                      null,
                      null,
                      null
                  )?.use { cursor ->
                      if (cursor.moveToFirst()) {
                          val index = cursor.getColumnIndex(
                              android.provider.OpenableColumns.DISPLAY_NAME
                          )
                          if (index >= 0) {
                              name = cursor.getString(index) ?: name
                          }
                      }
                  }
              } catch (_: Exception) {
              }

              return name
          }

          private fun loadLibrary(
              prefs: android.content.SharedPreferences
          ): List<VideoFile> {
              val raw = prefs.getString("library", null) ?: return emptyList()

              return raw.split("\n").mapNotNull { line ->
                  val parts = line.split("|")
                  if (parts.size < 2) return@mapNotNull null

                  try {
                      val uri = Uri.parse(Uri.decode(parts[0]))
                      val name = Uri.decode(parts[1])

                      VideoFile(
                          uri = uri,
                          name = name,
                          position = prefs.getLong("position_${uri}", 0L),
                          duration = prefs.getLong("duration_${uri}", 0L)
                      )
                  } catch (_: Exception) {
                      null
                  }
              }
          }

          private fun saveLibrary(
              prefs: android.content.SharedPreferences,
              library: List<VideoFile>
          ) {
              val raw = library.joinToString("\n") {
                  "${Uri.encode(it.uri.toString())}|${Uri.encode(it.name)}"
              }

              prefs.edit().putString("library", raw).apply()
          }

          private fun saveProgress(
              prefs: android.content.SharedPreferences,
              video: VideoFile,
              position: Long,
              duration: Long
          ) {
              val completed = duration > 0L &&
                  position >= duration * 0.92

              prefs.edit()
                  .putLong(
                      "position_${video.uri}",
                      if (completed) 0L else position.coerceAtLeast(0L)
                  )
                  .putLong(
                      "duration_${video.uri}",
                      duration.coerceAtLeast(0L)
                  )
                  .apply()
          }

          private fun formatTime(ms: Long): String {
              if (ms <= 0L) return "00:00"

              val total = ms / 1000
              val hours = total / 3600
              val minutes = (total % 3600) / 60
              val seconds = total % 60

              return if (hours > 0) {
                  "%02d:%02d:%02d".format(hours, minutes, seconds)
              } else {
                  "%02d:%02d".format(minutes, seconds)
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Infuse-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
