          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.input.pointer.pointerInput
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalLifecycleOwner
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.lifecycle.Lifecycle
          import androidx.lifecycle.LifecycleEventObserver
          import androidx.media3.common.AudioAttributes
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem as ExoMediaItem
          import androidx.media3.common.MimeTypes
          import androidx.media3.common.Player
          import androidx.media3.common.TrackSelectionOverride
          import androidx.media3.common.Tracks
          import androidx.media3.common.util.UnstableApi
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.AspectRatioFrameLayout
          import androidx.media3.ui.PlayerView
          import com.infuse.player.data.model.MediaItem
          import com.infuse.player.data.repository.MediaRepository
          import kotlinx.coroutines.delay

          data class TrackChoice(
              val label: String,
              val groupIndex: Int,
              val trackIndex: Int,
              val isSelected: Boolean
          )

          @OptIn(UnstableApi::class)
          @Composable
          fun PlayerScreen(
              media: MediaItem,
              initialSeekMs: Long,
              repository: MediaRepository,
              onBack: () -> Unit
          ) {
              val context = LocalContext.current
              val activity = context as? Activity
              val lifecycleOwner = LocalLifecycleOwner.current
              val audioManager = remember { context.getSystemService(Context.AUDIO_SERVICE) as AudioManager }

              var brightness by remember {
                  val cur = activity?.window?.attributes?.screenBrightness ?: 0.75f
                  mutableFloatStateOf(if (cur < 0) 0.75f else cur)
              }
              val maxVolume = remember { audioManager.getStreamMaxVolume(AudioManager.STREAM_MUSIC).coerceAtLeast(1) }
              var currentVolume by remember {
                  mutableFloatStateOf(audioManager.getStreamVolume(AudioManager.STREAM_MUSIC).toFloat() / maxVolume)
              }

              var showBrightnessHud by remember { mutableStateOf(false) }
              var showVolumeHud by remember { mutableStateOf(false) }
              var showControls by remember { mutableStateOf(true) }
              var showAudioDialog by remember { mutableStateOf(false) }
              var showSubtitleDialog by remember { mutableStateOf(false) }
              var showInfoDialog by remember { mutableStateOf(false) }

              var isPlaying by remember { mutableStateOf(true) }
              var currentPosition by remember { mutableLongStateOf(initialSeekMs) }
              var totalDuration by remember { mutableLongStateOf((media.durationSeconds * 1000).coerceAtLeast(1L)) }

              var detectedVideoTrackInfo by remember { mutableStateOf("${media.resolution} • ${media.videoCodec}") }
              var detectedAudioTrackInfo by remember { mutableStateOf(media.audioSpec) }
              var audioTrackChoices by remember { mutableStateOf<List<TrackChoice>>(emptyList()) }
              var subtitleTrackChoices by remember { mutableStateOf<List<TrackChoice>>(emptyList()) }
              var subtitlesDisabled by remember { mutableStateOf(false) }
              var externalSubUri by remember { mutableStateOf<Uri?>(null) }
              var resizeMode by remember { mutableIntStateOf(AspectRatioFrameLayout.RESIZE_MODE_FIT) }

              val exoPlayer = remember {
                  // EXTENSION_RENDERER_MODE_PREFER activates the bundled FFmpeg decoder for AC3, EAC3, DTS, TrueHD, FLAC, Vorbis!
                  val renderersFactory = DefaultRenderersFactory(context)
                      .setExtensionRendererMode(DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER)
                      .setEnableDecoderFallback(true)

                  val audioAttributes = AudioAttributes.Builder()
                      .setUsage(C.USAGE_MEDIA)
                      .setContentType(C.AUDIO_CONTENT_TYPE_MOVIE)
                      .build()

                  ExoPlayer.Builder(context, renderersFactory)
                      .setAudioAttributes(audioAttributes, /* handleAudioFocus = */ true)
                      .build().apply {
                          volume = 1.0f
                          setMediaItem(ExoMediaItem.fromUri(media.streamUri))
                          prepare()
                          if (initialSeekMs > 0L) {
                              seekTo(initialSeekMs)
                          }
                          playWhenReady = true
                      }
              }

              fun refreshTracks(tracks: Tracks) {
                  val aList = mutableListOf<TrackChoice>()
                  val sList = mutableListOf<TrackChoice>()

                  tracks.groups.forEachIndexed { groupIdx, group ->
                      if (group.type == C.TRACK_TYPE_VIDEO && group.length > 0) {
                          val fmt = group.getTrackFormat(0)
                          val fps = if (fmt.frameRate > 0) "${fmt.frameRate.toInt()} fps" else media.frameRate
                          detectedVideoTrackInfo = "${fmt.width}x${fmt.height} • ${fmt.sampleMimeType ?: media.videoCodec} • $fps"
                      }
                      if (group.type == C.TRACK_TYPE_AUDIO) {
                          for (tIdx in 0 until group.length) {
                              val fmt = group.getTrackFormat(tIdx)
                              val lang = (fmt.language ?: "Track ${aList.size + 1}").uppercase()
                              val mime = fmt.sampleMimeType?.substringAfter("/")?.uppercase() ?: "AUDIO"
                              val ch = if (fmt.channelCount > 0) "${fmt.channelCount}ch" else "Stereo"
                              val sr = if (fmt.sampleRate > 0) "${fmt.sampleRate / 1000}kHz" else ""
                              val selected = group.isTrackSelected(tIdx)
                              val label = "$lang • $mime ($ch $sr)".trim()
                              if (selected) detectedAudioTrackInfo = label
                              aList.add(TrackChoice(label, groupIdx, tIdx, selected))
                          }
                      }
                      if (group.type == C.TRACK_TYPE_TEXT) {
                          for (tIdx in 0 until group.length) {
                              val fmt = group.getTrackFormat(tIdx)
                              val lang = (fmt.language ?: fmt.label ?: "Subtitle ${sList.size + 1}").uppercase()
                              val mime = fmt.sampleMimeType?.substringAfter("/")?.uppercase() ?: "SUB"
                              val selected = group.isTrackSelected(tIdx)
                              sList.add(TrackChoice("$lang ($mime)", groupIdx, tIdx, selected))
                          }
                      }
                  }
                  audioTrackChoices = aList
                  subtitleTrackChoices = sList
              }

              DisposableEffect(exoPlayer) {
                  val listener = object : Player.Listener {
                      override fun onIsPlayingChanged(playing: Boolean) {
                          isPlaying = playing
                      }
                      override fun onPlaybackStateChanged(state: Int) {
                          if (state == Player.STATE_READY && exoPlayer.duration > 0) {
                              totalDuration = exoPlayer.duration
                          }
                      }
                      override fun onTracksChanged(tracks: Tracks) {
                          refreshTracks(tracks)
                      }
                  }
                  exoPlayer.addListener(listener)
                  onDispose {
                      repository.savePlaybackPosition(media.streamUri, exoPlayer.currentPosition, exoPlayer.duration)
                      exoPlayer.removeListener(listener)
                      exoPlayer.release()
                  }
              }

              DisposableEffect(lifecycleOwner) {
                  val observer = LifecycleEventObserver { _, event ->
                      if (event == Lifecycle.Event.ON_PAUSE || event == Lifecycle.Event.ON_STOP) {
                          repository.savePlaybackPosition(media.streamUri, exoPlayer.currentPosition, exoPlayer.duration)
                          exoPlayer.pause()
                      }
                  }
                  lifecycleOwner.lifecycle.addObserver(observer)
                  onDispose { lifecycleOwner.lifecycle.removeObserver(observer) }
              }

              val subtitleFilePicker = rememberLauncherForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  uri?.let { subUri ->
                      externalSubUri = subUri
                      val curPos = exoPlayer.currentPosition
                      val subConfig = ExoMediaItem.SubtitleConfiguration.Builder(subUri)
                          .setMimeType(MimeTypes.APPLICATION_SUBRIP)
                          .setLanguage("External")
                          .setSelectionFlags(C.SELECTION_FLAG_DEFAULT)
                          .build()
                      val updatedItem = ExoMediaItem.Builder()
                          .setUri(media.streamUri)
                          .setSubtitleConfigurations(listOf(subConfig))
                          .build()
                      exoPlayer.setMediaItem(updatedItem, curPos)
                      exoPlayer.prepare()
                      exoPlayer.play()
                      showSubtitleDialog = false
                  }
              }

              LaunchedEffect(showControls, isPlaying) {
                  if (showControls && isPlaying) {
                      delay(4000)
                      showControls = false
                  }
              }

              LaunchedEffect(exoPlayer) {
                  while (true) {
                      currentPosition = exoPlayer.currentPosition
                      if (exoPlayer.isPlaying && currentPosition > 2000L) {
                          repository.savePlaybackPosition(media.streamUri, currentPosition, totalDuration)
                      }
                      delay(1000)
                  }
              }

              Box(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.Black)
                      .pointerInput(Unit) {
                          detectTapGestures(
                              onTap = { showControls = !showControls },
                              onDoubleTap = { offset ->
                                  val isLeft = offset.x < size.width / 2
                                  val delta = if (isLeft) -10_000L else 10_000L
                                  exoPlayer.seekTo((exoPlayer.currentPosition + delta).coerceAtLeast(0L))
                              }
                          )
                      }
                      .pointerInput(Unit) {
                          detectDragGestures(
                              onDragEnd = {
                                  showBrightnessHud = false
                                  showVolumeHud = false
                              },
                              onDragCancel = {
                                  showBrightnessHud = false
                                  showVolumeHud = false
                              },
                              onDrag = { change, dragAmount ->
                                  change.consume()
                                  val isLeft = change.position.x < size.width / 2
                                  val delta = -dragAmount.y / 400f
                                  if (isLeft) {
                                      showBrightnessHud = true
                                      brightness = (brightness + delta).coerceIn(0.05f, 1f)
                                      activity?.window?.let { win ->
                                          val lp = win.attributes
                                          lp.screenBrightness = brightness
                                          win.attributes = lp
                                      }
                                  } else {
                                      showVolumeHud = true
                                      currentVolume = (currentVolume + delta).coerceIn(0f, 1f)
                                      audioManager.setStreamVolume(
                                          AudioManager.STREAM_MUSIC,
                                          (currentVolume * maxVolume).toInt(),
                                          0
                                      )
                                  }
                              }
                          )
                      }
              ) {
                  AndroidView(
                      factory = { ctx ->
                          PlayerView(ctx).apply {
                              player = exoPlayer
                              useController = false
                              layoutParams = FrameLayout.LayoutParams(
                                  ViewGroup.LayoutParams.MATCH_PARENT,
                                  ViewGroup.LayoutParams.MATCH_PARENT
                              )
                          }
                      },
                      update = { view -> view.resizeMode = resizeMode },
                      modifier = Modifier.fillMaxSize()
                  )

                  AnimatedVisibility(
                      visible = showBrightnessHud,
                      enter = fadeIn(),
                      exit = fadeOut(),
                      modifier = Modifier.align(Alignment.CenterStart).padding(start = 24.dp)
                  ) {
                      HudBar(Icons.Default.BrightnessMedium, brightness, "${(brightness * 100).toInt()}%", Color(0xFFF59E0B))
                  }

                  AnimatedVisibility(
                      visible = showVolumeHud,
                      enter = fadeIn(),
                      exit = fadeOut(),
                      modifier = Modifier.align(Alignment.CenterEnd).padding(end = 24.dp)
                  ) {
                      HudBar(Icons.Default.VolumeUp, currentVolume, "${(currentVolume * 100).toInt()}%", Color(0xFF38BDF8))
                  }

                  AnimatedVisibility(
                      visible = showControls,
                      enter = fadeIn(),
                      exit = fadeOut(),
                      modifier = Modifier.fillMaxSize()
                  ) {
                      Column(
                          modifier = Modifier
                              .fillMaxSize()
                              .background(
                                  Brush.verticalGradient(
                                      listOf(Color.Black.copy(alpha = 0.8f), Color.Transparent, Color.Black.copy(alpha = 0.85f))
                                  )
                              )
                              .padding(20.dp),
                          verticalArrangement = Arrangement.SpaceBetween
                      ) {
                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceBetween,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              IconButton(onClick = {
                                  repository.savePlaybackPosition(media.streamUri, exoPlayer.currentPosition, exoPlayer.duration)
                                  onBack()
                              }) {
                                  Icon(Icons.Default.ArrowBack, contentDescription = "Back", tint = Color.White)
                              }
                              Column(
                                  horizontalAlignment = Alignment.CenterHorizontally,
                                  modifier = Modifier.weight(1f).padding(horizontal = 8.dp)
                              ) {
                                  Text(media.title, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 15.sp, maxLines = 1)
                                  Text(detectedVideoTrackInfo, color = Color(0xFFF97316), fontSize = 11.sp, maxLines = 1)
                              }
                              Row {
                                  IconButton(onClick = { showAudioDialog = true }) {
                                      Icon(Icons.Default.Audiotrack, contentDescription = "Audio Tracks", tint = Color.White)
                                  }
                                  IconButton(onClick = { showSubtitleDialog = true }) {
                                      Icon(Icons.Default.Subtitles, contentDescription = "Subtitles", tint = Color.White)
                                  }
                                  IconButton(onClick = {
                                      resizeMode = if (resizeMode == AspectRatioFrameLayout.RESIZE_MODE_FIT) {
                                          AspectRatioFrameLayout.RESIZE_MODE_ZOOM
                                      } else {
                                          AspectRatioFrameLayout.RESIZE_MODE_FIT
                                      }
                                  }) {
                                      Icon(Icons.Default.AspectRatio, contentDescription = "Aspect Ratio", tint = Color.White)
                                  }
                                  IconButton(onClick = { showInfoDialog = true }) {
                                      Icon(Icons.Default.Info, contentDescription = "Format Info", tint = Color.White)
                                  }
                              }
                          }

                          Row(
                              modifier = Modifier.fillMaxWidth(),
                              horizontalArrangement = Arrangement.SpaceEvenly,
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              IconButton(onClick = { exoPlayer.seekTo((exoPlayer.currentPosition - 10_000L).coerceAtLeast(0L)) }) {
                                  Icon(Icons.Default.Replay10, contentDescription = "-10s", tint = Color.White, modifier = Modifier.size(36.dp))
                              }
                              IconButton(
                                  onClick = { if (exoPlayer.isPlaying) exoPlayer.pause() else exoPlayer.play() },
                                  modifier = Modifier.size(72.dp).background(Color(0xFFF97316), CircleShape)
                              ) {
                                  Icon(
                                      if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                      contentDescription = "Play/Pause",
                                      tint = Color.White,
                                      modifier = Modifier.size(36.dp)
