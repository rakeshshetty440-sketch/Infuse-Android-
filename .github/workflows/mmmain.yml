name: Build Infuse Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Compile APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Generate Full Local Video Scanner & Universal Player
        run: |
          rm -rf app/src/main/java *.kt
          mkdir -p app/src/main/java/com/infuse/player/data/model
          mkdir -p app/src/main/java/com/infuse/player/data/repository
          mkdir -p app/src/main/java/com/infuse/player/data/scraper
          mkdir -p app/src/main/java/com/infuse/player/ui/library
          mkdir -p app/src/main/java/com/infuse/player/ui/player
          mkdir -p app/src/main/java/com/infuse/player/ui/theme
          mkdir -p app/src/main/res/values

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />

              <application
                  android:allowBackup="true"
                  android:icon="@android:drawable/sym_def_app_icon"
                  android:label="Infuse"
                  android:supportsRtl="true"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:hardwareAccelerated="true"
                  android:largeHeap="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:supportsPictureInPicture="true"
                      android:configChanges="orientation|screenSize|screenLayout|smallestScreenSize|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:mimeType="video/*" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">Infuse</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/java/com/infuse/player/data/model/MediaItem.kt
          package com.infuse.player.data.model

          data class MediaItem(
              val id: String,
              val title: String,
              val rawFilename: String = "",
              val year: Int = 2026,
              val durationText: String = "--",
              val durationSeconds: Long = 0L,
              val rating: String = "8.5",
              val qualityTag: String = "HD",
              val resolution: String = "1920x1080",
              val audioSpec: String = "Multi-Track Audio",
              val videoCodec: String = "Hardware Direct",
              val container: String = "MKV / MP4",
              val bitrate: String = "--",
              val fileSize: String = "--",
              val streamUri: String,
              val posterUrl: String = "",
              val backdropUrl: String = "",
              val synopsis: String = "Scanning metadata...",
              val isWatched: Boolean = false
          )
          EOF

          cat << 'EOF' > app/src/main/java/com/infuse/player/data/scraper/FilenameParser.kt
          package com.infuse.player.data.scraper

          object FilenameParser {
              private val TV_REGEX = Regex("(?i)[._ -]S(\\d{1,2})[._ -]?E(\\d{1,3})")
              private val YEAR_REGEX = Regex("[._ -]\\(?((?:19|20)\\d{2})\\)?")
              private val TAGS = listOf(
                  "2160p", "1080p", "720p", "480p", "4k", "uhd", "hdr", "hdr10", "dv", "dovi",
                  "remux", "bluray", "bdrip", "web-dl", "webrip", "hdtv", "x264", "x265",
                  "h264", "h265", "hevc", "av1", "10bit", "truehd", "atmos", "dts", "ac3", "aac"
              )

              data class ParsedInfo(val cleanTitle: String, val year: Int?, val isTv: Boolean)

              fun parse(rawFilename: String): ParsedInfo {
                  val name = rawFilename.substringBeforeLast(".")
                  val tvMatch = TV_REGEX.find(name)
                  if (tvMatch != null) {
                      val raw = name.substring(0, tvMatch.range.first)
                      return ParsedInfo(clean(raw), null, true)
                  }
                  val yearMatch = YEAR_REGEX.find(name)
                  val year = yearMatch?.groupValues?.get(1)?.toIntOrNull()
                  val raw = if (yearMatch != null) name.substring(0, yearMatch.range.first) else name
                  val cleaned = clean(raw)
                  return ParsedInfo(if (cleaned.isNotBlank()) cleaned else name, year, false)
              }

              private fun clean(raw: String): String {
                  var s = raw.replace(Regex("[._\\[\\]()-]"), " ").trim()
                  TAGS.forEach { tag -> s = s.replace(Regex("(?i)\\b$tag\\b"), "") }
                  return s.replace(Regex("\\s+"), " ").trim()
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/infuse/player/data/scraper/TmdbScraperService.kt
          package com.infuse.player.data.scraper

          import com.infuse.player.data.model.MediaItem
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.withContext
          import okhttp3.OkHttpClient
          import okhttp3.Request
          import org.json.JSONObject
          import java.net.URLEncoder

          class TmdbScraperService(
              private val apiKey: String = "f52f0d6c1b1784ece4eed64ff99052ac",
              private val client: OkHttpClient = OkHttpClient()
          ) {
              suspend fun enrichWithMetadata(item: MediaItem): MediaItem = withContext(Dispatchers.IO) {
                  val parsed = FilenameParser.parse(item.rawFilename.ifEmpty { item.title })
                  val query = URLEncoder.encode(parsed.cleanTitle, "UTF-8")
                  val endpoint = if (parsed.isTv) "search/tv" else "search/movie"
                  val yearParam = if (parsed.year != null && !parsed.isTv) "&year=${parsed.year}" else ""
                  val url = "https://api.themoviedb.org/3/$endpoint?api_key=$apiKey&query=$query$yearParam"

                  try {
                      val req = Request.Builder().url(url).build()
                      client.newCall(req).execute().use { res ->
                          if (res.isSuccessful) {
                              val json = JSONObject(res.body?.string() ?: "{}")
                              val results = json.optJSONArray("results")
                              if (results != null && results.length() > 0) {
                                  val first = results.getJSONObject(0)
                                  val officialTitle = if (parsed.isTv) first.optString("name", parsed.cleanTitle) else first.optString("title", parsed.cleanTitle)
                                  val poster = first.optString("poster_path", "")
                                  val backdrop = first.optString("backdrop_path", "")
                                  val overview = first.optString("overview", "")
                                  val vote = first.optDouble("vote_average", 8.0)
                                  val date = if (parsed.isTv) first.optString("first_air_date") else first.optString("release_date")
                                  val yr = date.take(4).toIntOrNull() ?: parsed.year ?: item.year

                                  return@withContext item.copy(
                                      title = officialTitle,
                                      year = yr,
                                      rating = String.format("%.1f", vote),
                                      posterUrl = if (poster.isNotEmpty()) "https://image.tmdb.org/t/p/w500$poster" else item.posterUrl,
                                      backdropUrl = if (backdrop.isNotEmpty()) "https://image.tmdb.org/t/p/w1280$backdrop" else item.backdropUrl,
                                      synopsis = if (overview.isNotEmpty()) overview else "Local file: ${item.rawFilename}"
                                  )
                              }
                          }
                      }
                  } catch (_: Exception) {}

                  item.copy(
                      title = parsed.cleanTitle,
                      year = parsed.year ?: item.year,
                      synopsis = "Local video file (${item.rawFilename}) • Resolution: ${item.resolution} • Size: ${item.fileSize}"
                  )
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/infuse/player/data/repository/MediaRepository.kt
          package com.infuse.player.data.repository

          import android.content.ContentUris
          import android.content.Context
          import android.media.MediaMetadataRetriever
          import android.net.Uri
          import android.provider.MediaStore
          import android.provider.OpenableColumns
          import com.infuse.player.data.model.MediaItem
          import com.infuse.player.data.scraper.TmdbScraperService
          import kotlinx.coroutines.CoroutineScope
          import kotlinx.coroutines.Dispatchers
          import kotlinx.coroutines.flow.MutableStateFlow
          import kotlinx.coroutines.flow.StateFlow
          import kotlinx.coroutines.flow.asStateFlow
          import kotlinx.coroutines.launch
          import java.util.Locale

          class MediaRepository(private val context: Context) {
              private val scraper = TmdbScraperService()
              private val scope = CoroutineScope(Dispatchers.IO)

              private val _mediaList = MutableStateFlow<List<MediaItem>>(emptyList())
              val mediaList: StateFlow<List<MediaItem>> = _mediaList.asStateFlow()

              private val _isScanning = MutableStateFlow(false)
              val isScanning: StateFlow<Boolean> = _isScanning.asStateFlow()

              fun scanDeviceVideos() {
                  scope.launch {
                      _isScanning.value = true
                      val discovered = mutableListOf<MediaItem>()
                      val projection = arrayOf(
                          MediaStore.Video.Media._ID,
                          MediaStore.Video.Media.DISPLAY_NAME,
                          MediaStore.Video.Media.DURATION,
                          MediaStore.Video.Media.SIZE,
                          MediaStore.Video.Media.WIDTH,
                          MediaStore.Video.Media.HEIGHT,
                          MediaStore.Video.Media.MIME_TYPE
                      )
                      val sortOrder = "${MediaStore.Video.Media.DATE_ADDED} DESC"

                      try {
                          context.contentResolver.query(
                              MediaStore.Video.Media.EXTERNAL_CONTENT_URI,
                              projection,
                              null,
                              null,
                              sortOrder
                          )?.use { cursor ->
                              val idCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media._ID)
                              val nameCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DISPLAY_NAME)
                              val durCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.DURATION)
                              val sizeCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.SIZE)
                              val widthCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.WIDTH)
                              val heightCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.HEIGHT)
                              val mimeCol = cursor.getColumnIndexOrThrow(MediaStore.Video.Media.MIME_TYPE)

                              while (cursor.moveToNext()) {
                                  val id = cursor.getLong(idCol)
                                  val name = cursor.getString(nameCol) ?: "Video_$id.mp4"
                                  val durationMs = cursor.getLong(durCol)
                                  val sizeBytes = cursor.getLong(sizeCol)
                                  val w = cursor.getInt(widthCol)
                                  val h = cursor.getInt(heightCol)
                                  val mime = cursor.getString(mimeCol) ?: "video/mp4"
                                  val contentUri = ContentUris.withAppendedId(MediaStore.Video.Media.EXTERNAL_CONTENT_URI, id)

                                  val baseItem = createMediaItemFromSpecs(
                                      id = "local_$id",
                                      name = name,
                                      uri = contentUri.toString(),
                                      durationMs = durationMs,
                                      sizeBytes = sizeBytes,
                                      width = w,
                                      height = h,
                                      mime = mime
                                  )
                                  discovered.add(baseItem)
                              }
                          }
                      } catch (_: Exception) {}

                      if (discovered.isEmpty()) {
                          discovered.addAll(defaultDemoSamples())
                      }
                      _mediaList.value = discovered

                      // Enrich each video asynchronously with TMDb Posters & Plot Metadata
                      val enrichedList = discovered.toMutableList()
                      for (i in enrichedList.indices) {
                          val enriched = scraper.enrichWithMetadata(enrichedList[i])
                          enrichedList[i] = enriched
                          _mediaList.value = enrichedList.toList()
                      }
                      _isScanning.value = false
                  }
              }

              fun addPickedVideoUri(uri: Uri, onReady: (MediaItem) -> Unit) {
                  scope.launch {
                      var displayName = "Picked_Video.mp4"
                      var sizeBytes = 0L
                      try {
                          context.contentResolver.query(uri, null, null, null, null)?.use { c ->
                              if (c.moveToFirst()) {
                                  val nameIdx = c.getColumnIndex(OpenableColumns.DISPLAY_NAME)
                                  val sizeIdx = c.getColumnIndex(OpenableColumns.SIZE)
                                  if (nameIdx != -1) displayName = c.getString(nameIdx) ?: displayName
                                  if (sizeIdx != -1) sizeBytes = c.getLong(sizeIdx)
                              }
                          }
                      } catch (_: Exception) {}

                      var durationMs = 0L
                      var width = 1920
                      var height = 1080
                      var bitrateBps = 0L
                      var mime = "video/*"

                      val retriever = MediaMetadataRetriever()
                      try {
                          retriever.setDataSource(context, uri)
                          durationMs = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLongOrNull() ?: 0L
                          width = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_WIDTH)?.toIntOrNull() ?: 1920
                          height = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_VIDEO_HEIGHT)?.toIntOrNull() ?: 1080
                          bitrateBps = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_BITRATE)?.toLongOrNull() ?: 0L
                          mime = retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_MIMETYPE) ?: "video/mp4"
                      } catch (_: Exception) {
                      } finally {
                          try { retriever.release() } catch (_: Exception) {}
                      }

                      val rawItem = createMediaItemFromSpecs(
                          id = "picked_${System.currentTimeMillis()}",
                          name = displayName,
                          uri = uri.toString(),
                          durationMs = durationMs,
                          sizeBytes = sizeBytes,
                          width = width,
                          height = height,
                          mime = mime,
                          bitrateBps = bitrateBps
                      )
                      val enriched = scraper.enrichWithMetadata(rawItem)
                      _mediaList.value = listOf(enriched) + _mediaList.value
                      kotlinx.coroutines.withContext(Dispatchers.Main) {
                          onReady(enriched)
                      }
                  }
              }

              fun toggleWatched(id: String) {
                  _mediaList.value = _mediaList.value.map {
                      if (it.id == id) it.copy(isWatched = !it.isWatched) else it
                  }
              }

              private fun createMediaItemFromSpecs(
                  id: String,
                  name: String,
                  uri: String,
                  durationMs: Long,
                  sizeBytes: Long,
                  width: Int,
                  height: Int,
                  mime: String,
                  bitrateBps: Long = 0L
              ): MediaItem {
                  val quality = when {
                      width >= 3800 || height >= 2100 -> "4K UHD"
                      width >= 1900 || height >= 1000 -> "1080p FHD"
                      width >= 1200 || height >= 700 -> "720p HD"
                      else -> "SD Direct"
                  }
                  val ext = name.substringAfterLast(".", "MP4").uppercase(Locale.ROOT)
                  val sizeMb = if (sizeBytes > 0) String.format(Locale.US, "%.1f MB", sizeBytes / (1024.0 * 1024.0)) else "Direct Stream"
                  val calcBitrate = if (bitrateBps > 0) {
                      String.format(Locale.US, "%.1f Mbps", bitrateBps / 1_000_000.0)
                  } else if (durationMs > 0 && sizeBytes > 0) {
                      val bps = (sizeBytes * 8.0) / (durationMs / 1000.0)
                      String.format(Locale.US, "%.1f Mbps", bps / 1_000_000.0)
                  } else {
                      "Variable Bitrate"
                  }

                  val totalSecs = durationMs / 1000
                  val hrs = totalSecs / 3600
                  val mins = (totalSecs % 3600) / 60
                  val durText = if (hrs > 0) "${hrs}h ${mins}m" else "${mins}m ${(totalSecs % 60)}s"

                  return MediaItem(
                      id = id,
                      title = name.substringBeforeLast("."),
                      rawFilename = name,
                      year = 2026,
                      durationText = durText,
                      durationSeconds = totalSecs,
                      rating = "Local",
                      qualityTag = quality,
                      resolution = if (width > 0 && height > 0) "${width}x${height}" else "Auto",
                      audioSpec = "Direct Hardware Audio",
                      videoCodec = "$mime ($ext)",
                      container = ext,
                      bitrate = calcBitrate,
                      fileSize = sizeMb,
                      streamUri = uri,
                      posterUrl = "https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?w=600&q=80",
                      backdropUrl = "https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=1200&q=80",
                      synopsis = "Local video file: $name"
                  )
              }

              private fun defaultDemoSamples(): List<MediaItem> = listOf(
                  MediaItem(
                      id = "demo_1",
                      title = "Big Buck Bunny",
                      rawFilename = "Big.Buck.Bunny.2008.1080p.BluRay.x264.mp4",
                      year = 2008,
                      durationText = "9m 56s",
                      durationSeconds = 596,
                      rating = "8.1",
                      qualityTag = "1080p FHD",
                      resolution = "1920x1080",
                      audioSpec = "AAC 5.1 Surround",
                      videoCodec = "AVC1 High@L4.1",
                      container = "MP4",
                      bitrate = "5.2 Mbps",
                      fileSize = "158 MB",
                      streamUri = "https://storage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4",
                      posterUrl = "https://images.unsplash.com/photo-1451187580459-43490279c0fa?w=600&q=80",
                      backdropUrl = "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?w=1200&q=80",
                      synopsis = "Tap Open Video in the top bar or grant storage permissions to scan and play all local videos on your phone with automatic TMDb metadata!"
                  )
              )
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/infuse/player/ui/theme/Theme.kt
          package com.infuse.player.ui.theme

          import androidx.compose.material3.MaterialTheme
          import androidx.compose.material3.darkColorScheme
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.graphics.Color

          private val DarkColorScheme = darkColorScheme(
              primary = Color(0xFFF97316),
              secondary = Color(0xFFF59E0B),
              background = Color(0xFF0B0C0F),
              surface = Color(0xFF13151B),
              onPrimary = Color.White,
              onBackground = Color(0xFFF3F4F6),
              onSurface = Color(0xFFF3F4F6)
          )

          @Composable
          fun InfuseTheme(content: @Composable () -> Unit) {
              MaterialTheme(colorScheme = DarkColorScheme, content = content)
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/infuse/player/ui/library/MediaDetailSheet.kt
          package com.infuse.player.ui.library

          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.CheckCircle
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material3.*
          import androidx.compose.runtime.Composable
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import coil.compose.AsyncImage
          import com.infuse.player.data.model.MediaItem

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          fun MediaDetailSheet(
              media: MediaItem,
              onDismiss: () -> Unit,
              onPlay: () -> Unit,
              onToggleWatched: () -> Unit
          ) {
              ModalBottomSheet(
                  onDismissRequest = onDismiss,
                  containerColor = Color(0xFF13151B)
              ) {
                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .padding(20.dp),
                      verticalArrangement = Arrangement.spacedBy(14.dp)
                  ) {
                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(16.dp)
                      ) {
                          AsyncImage(
                              model = media.posterUrl,
                              contentDescription = null,
                              modifier = Modifier
                                  .width(95.dp)
                                  .aspectRatio(2f / 3f)
                                  .clip(RoundedCornerShape(10.dp)),
                              contentScale = ContentScale.Crop
                          )
                          Column(verticalArrangement = Arrangement.spacedBy(5.dp)) {
                              Text(media.title, color = Color.White, fontWeight = FontWeight.Bold, fontSize = 18.sp)
                              Text("${media.year} • ${media.durationText} • ★ ${media.rating}", color = Color.LightGray, fontSize = 12.sp)
                              Row(horizontalArrangement = Arrangement.spacedBy(6.dp)) {
                                  Badge(containerColor = Color(0x33F97316), contentColor = Color(0xFFF97316)) {
                                      Text(media.qualityTag, fontSize = 10.sp)
                                  }
                                  Badge(containerColor = Color(0x3338BDF8), contentColor = Color(0xFF38BDF8)) {
                                      Text(media.container, fontSize = 10.sp)
                                  }
                              }
                              if (media.rawFilename.isNotEmpty()) {
                                  Text(media.rawFilename, color = Color.Gray, fontSize = 11.sp, maxLines = 1)
                              }
                          }
                      }

                      Text(media.synopsis, color = Color(0xFFD1D5DB), fontSize = 13.sp, lineHeight = 18.sp)

                      Card(
                          colors = CardDefaults.cardColors(containerColor = Color(0xFF1A1D26)),
                          shape = RoundedCornerShape(12.dp)
                      ) {
                          Column(modifier = Modifier.padding(12.dp), verticalArrangement = Arrangement.spacedBy(4.dp)) {
                              Text("REAL-TIME VIDEO & STREAM METADATA", color = Color(0xFFF97316), fontSize = 10.sp, fontWeight = FontWeight.Bold)
                              Text("Resolution: ${media.resolution} (${media.qualityTag})", color = Color.White, fontSize = 12.sp)
                              Text("Format / Codec: ${media.videoCodec}", color = Color.White, fontSize = 12.sp)
                              Text("Bitrate: ${media.bitrate} • File Size: ${media.fileSize}", color = Color.White, fontSize = 12.sp)
                          }
                      }

                      Row(modifier = Modifier.fillMaxWidth(), horizontalArrangement = Arrangement.spacedBy(12.dp)) {
                          Button(
                              onClick = onPlay,
                              modifier = Modifier.weight(1f),
                              colors = ButtonDefaults.buttonColors(containerColor = Color(0xFFF97316)),
                              shape = RoundedCornerShape(12.dp)
                          ) {
                              Icon(Icons.Default.PlayArrow, contentDescription = null)
                              Spacer(modifier = Modifier.width(6.dp))
                              Text("Play Video")
                          }
                          OutlinedButton(
                              onClick = onToggleWatched,
                              modifier = Modifier.weight(1f),
                              shape = RoundedCornerShape(12.dp)
                          ) {
                              Icon(Icons.Default.CheckCircle, contentDescription = null, tint = if (media.isWatched) Color(0xFF34D399) else Color.Gray)
                              Spacer(modifier = Modifier.width(6.dp))
                              Text(if (media.isWatched) "Watched" else "Mark Watched", color = Color.White)
                          }
                      }
                  }
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/infuse/player/ui/library/LibraryScreen.kt
          package com.infuse.player.ui.library

          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.grid.GridCells
          import androidx.compose.foundation.lazy.grid.LazyVerticalGrid
          import androidx.compose.foundation.lazy.grid.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.FolderOpen
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material.icons.filled.Refresh
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Brush
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.layout.ContentScale
