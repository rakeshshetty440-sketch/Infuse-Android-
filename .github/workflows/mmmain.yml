
name: Build Infuse Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Create Android project
        shell: bash
        run: |
          mkdir -p app/src/main/java/com/infuse/player
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "InfusePlayer"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.infuse.player"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.infuse.player"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.foundation:foundation")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")

              implementation("androidx.media3:media3-exoplayer:1.5.1")
              implementation("androidx.media3:media3-ui:1.5.1")
              implementation("androidx.media3:media3-exoplayer-hls:1.5.1")
              implementation("androidx.media3:media3-exoplayer-dash:1.5.1")
          }
          EOF

          cat > app/src/main/res/values/strings.xml <<'EOF'
          <resources>
              <string name="app_name">Infuse</string>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:allowBackup="true"
                  android:label="Infuse"
                  android:theme="@android:style/Theme.Material.NoActionBar"
                  android:usesCleartextTraffic="true">

                  <activity
                      android:name=".MainActivity"
                      android:configChanges="orientation|screenSize|keyboardHidden"
                      android:screenOrientation="unspecified"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/infuse/player/MainActivity.kt <<'EOF'
          package com.infuse.player

          import android.content.Context
          import android.content.Intent
          import android.net.Uri
          import android.os.Bundle
          import android.view.ViewGroup
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.items
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.ArrowBack
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material.icons.filled.Settings
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.media3.common.C
          import androidx.media3.common.MediaItem
          import androidx.media3.common.MimeTypes
          import androidx.media3.common.Player
          import androidx.media3.common.TrackSelectionOverride
          import androidx.media3.common.Tracks
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.exoplayer.DefaultRenderersFactory
          import androidx.media3.ui.PlayerView
          import kotlinx.coroutines.delay
          import java.util.Locale

          private data class VideoFile(
              val uri: Uri,
              val name: String,
              val position: Long = 0L,
              val duration: Long = 0L
          )

          private data class TrackOption(
              val title: String,
              val group: Tracks.Group,
              val index: Int,
              val selected: Boolean
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      InfuseApp()
                  }
              }
          }

          @OptIn(ExperimentalMaterial3Api::class)
          @Composable
          private fun InfuseApp() {
              val context = LocalContext.current
              val prefs = remember {
                  context.getSharedPreferences("infuse_player", Context.MODE_PRIVATE)
              }

              var library by remember { mutableStateOf(loadLibrary(prefs)) }
              var currentVideo by remember { mutableStateOf<VideoFile?>(null) }
              var player by remember { mutableStateOf<ExoPlayer?>(null) }
              var tracks by remember { mutableStateOf(Tracks.EMPTY) }
              var showAudio by remember { mutableStateOf(false) }
              var showSubtitles by remember { mutableStateOf(false) }
              var isPlaying by remember { mutableStateOf(false) }
              var currentPosition by remember { mutableLongStateOf(0L) }
              var currentDuration by remember { mutableLongStateOf(0L) }
              var statusMessage by remember { mutableStateOf("") }

              val videoPicker = rememberLauncherForActivityResult(
                  ActivityResultContracts.OpenMultipleDocuments()
              ) { uris ->
                  uris.forEach { uri ->
                      try {
                          context.contentResolver.takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )
                      } catch (_: Exception) {
                      }

                      val name = displayName(context, uri)
                      if (library.none { it.uri == uri }) {
                          library = library + VideoFile(uri, name)
                      }
                  }
                  saveLibrary(prefs, library)
              }

              val subtitlePicker = rememberLauncherForActivityResult(
                  ActivityResultContracts.OpenDocument()
              ) { uri ->
                  if (uri != null && player != null && currentVideo != null) {
                      try {
                          context.contentResolver.takePersistableUriPermission(
                              uri,
                              Intent.FLAG_GRANT_READ_URI_PERMISSION
                          )
                      } catch (_: Exception) {
                      }

                      val name = displayName(context, uri)
                      val mime = subtitleMimeType(name, context, uri)

                      val subtitle = MediaItem.SubtitleConfiguration.Builder(uri)
                          .setMimeType(mime)
                          .setLanguage("und")
                          .setLabel(name)
                          .setSelectionFlags(C.SELECTION_FLAG_DEFAULT)
                          .build()

                      val video = currentVideo!!
                      val mediaItem = MediaItem.Builder()
                          .setUri(video.uri)
                          .setSubtitleConfigurations(listOf(subtitle))
                          .build()

                      val resumeAt = player!!.currentPosition
                      player!!.setMediaItem(mediaItem, resumeAt)
                      player!!.prepare()
                      player!!.playWhenReady = true
                      player!!.trackSelectionParameters =
                          player!!.trackSelectionParameters
                              .buildUpon()
                              .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, false)
                              .clearOverridesOfType(C.TRACK_TYPE_TEXT)
                              .build()
                      statusMessage = "Subtitle loaded: $name"
                  }
              }

              fun stopPlayer() {
                  player?.let {
                      saveProgress(prefs, currentVideo, it.currentPosition, it.duration)
                      it.release()
                  }
                  player = null
                  currentVideo = null
                  tracks = Tracks.EMPTY
                  isPlaying = false
              }

              fun playVideo(video: VideoFile) {
                  player?.release()

                  val renderers = DefaultRenderersFactory(context)
                      .setExtensionRendererMode(
                          DefaultRenderersFactory.EXTENSION_RENDERER_MODE_PREFER
                      )
                      .setEnableDecoderFallback(true)

                  val exo = ExoPlayer.Builder(context)
                      .setRenderersFactory(renderers)
                      .build()

                  player = exo
                  currentVideo = video

                  exo.addListener(object : Player.Listener {
                      override fun onTracksChanged(newTracks: Tracks) {
                          tracks = newTracks
                      }

                      override fun onIsPlayingChanged(playing: Boolean) {
                          isPlaying = playing
                      }

                      override fun onPlaybackStateChanged(state: Int) {
                          if (state == Player.STATE_ENDED) {
                              saveProgress(prefs, video, 0L, exo.duration)
                              library = library.map {
                                  if (it.uri == video.uri) it.copy(position = 0L) else it
                              }
                              saveLibrary(prefs, library)
                          }
                      }
                  })

                  exo.setMediaItem(
                      MediaItem.fromUri(video.uri),
                      video.position.coerceAtLeast(0L)
                  )
                  exo.prepare()
                  exo.playWhenReady = true
                  statusMessage = ""
              }

              LaunchedEffect(player, currentVideo) {
                  while (player != null && currentVideo != null) {
                      val active = player
                      val video = currentVideo
                      if (active != null && video != null) {
                          currentPosition = active.currentPosition.coerceAtLeast(0L)
                          currentDuration =
                              if (active.duration > 0L) active.duration else 0L

                          saveProgress(
                              prefs,
                              video,
                              active.currentPosition,
                              active.duration
                          )

                          library = library.map {
                              if (it.uri == video.uri) {
                                  it.copy(
                                      position = active.currentPosition.coerceAtLeast(0L),
                                      duration = active.duration.coerceAtLeast(0L)
                                  )
                              } else it
                          }
                      }
                      delay(2000)
                  }
              }

              val audioOptions = remember(tracks) {
                  getTrackOptions(tracks, C.TRACK_TYPE_AUDIO)
              }
              val subtitleOptions = remember(tracks) {
                  getTrackOptions(tracks, C.TRACK_TYPE_TEXT)
              }

              MaterialTheme(
                  colorScheme = darkColorScheme(
                      primary = Color(0xFF8AB4F8),
                      background = Color(0xFF101114),
                      surface = Color(0xFF1A1C20)
                  )
              ) {
                  Surface(
                      modifier = Modifier.fillMaxSize(),
                      color = Color(0xFF101114)
                  ) {
                      if (currentVideo == null) {
                          LibraryScreen(
                              library = library,
                              onAdd = {
                                  videoPicker.launch(
                                      arrayOf("video/*", "application/x-mpegURL")
                                  )
                              },
                              onPlay = { playVideo(it) },
                              onRemove = { video ->
                                  library = library.filterNot { it.uri == video.uri }
                                  saveLibrary(prefs, library)
                              }
                          )
                      } else {
                          PlayerScreen(
                              video = currentVideo!!,
                              player = player,
                              tracks = tracks,
                              audioOptions = audioOptions,
                              subtitleOptions = subtitleOptions,
                              currentPosition = currentPosition,
                              currentDuration = currentDuration,
                              isPlaying = isPlaying,
                              statusMessage = statusMessage,
                              onBack = {
                                  stopPlayer()
                              },
                              onAudio = { showAudio = true },
                              onSubtitles = { showSubtitles = true },
                              onAddSubtitle = {
                                  subtitlePicker.launch(
                                      arrayOf(
                                          "application/x-subrip",
                                          "text/vtt",
                                          "text/plain",
                                          "application/octet-stream"
                                      )
                                  )
                              }
                          )
                      }

                      if (showAudio) {
                          TrackDialog(
                              title = "Audio language",
                              options = audioOptions,
                              onDismiss = { showAudio = false },
                              onOff = null,
                              onSelect = { option ->
                                  player?.let { exo ->
                                      exo.trackSelectionParameters =
                                          exo.trackSelectionParameters
                                              .buildUpon()
                                              .setTrackTypeDisabled(C.TRACK_TYPE_AUDIO, false)
                                              .clearOverridesOfType(C.TRACK_TYPE_AUDIO)
                                              .addOverride(
                                                  TrackSelectionOverride(
                                                      option.group.mediaTrackGroup,
                                                      listOf(option.index)
                                                  )
                                              )
                                              .build()
                                  }
                                  showAudio = false
                              }
                          )
                      }

                      if (showSubtitles) {
                          TrackDialog(
                              title = "Subtitles",
                              options = subtitleOptions,
                              onDismiss = { showSubtitles = false },
                              onOff = {
                                  player?.let { exo ->
                                      exo.trackSelectionParameters =
                                          exo.trackSelectionParameters
                                              .buildUpon()
                                              .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, true)
                                              .clearOverridesOfType(C.TRACK_TYPE_TEXT)
                                              .build()
                                  }
                                  showSubtitles = false
                              },
                              onSelect = { option ->
                                  player?.let { exo ->
                                      exo.trackSelectionParameters =
                                          exo.trackSelectionParameters
                                              .buildUpon()
                                              .setTrackTypeDisabled(C.TRACK_TYPE_TEXT, false)
                                              .clearOverridesOfType(C.TRACK_TYPE_TEXT)
                                              .addOverride(
                                                  TrackSelectionOverride(
                                                      option.group.mediaTrackGroup,
                                                      listOf(option.index)
                                                  )
                                              )
                                              .build()
                                  }
                                  showSubtitles = false
                              }
                          )
                      }
                  }
              }
          }

          @Composable
          private fun LibraryScreen(
              library: List<VideoFile>,
              onAdd: () -> Unit,
              onPlay: (VideoFile) -> Unit,
              onRemove: (VideoFile) -> Unit
          ) {
              val continueWatching = library.filter {
                  it.position > 5000L &&
                  (it.duration <= 0L || it.position < it.duration * 0.92)
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF101114))
                      .padding(18.dp)
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically,
                      horizontalArrangement = Arrangement.SpaceBetween
                  ) {
                      Column {
                          Text(
                              "INFUSE",
                              color = Color.White,
                              fontSize = 28.sp,
                              fontWeight = FontWeight.Bold
                          )
                          Text(
                              "Your personal media library",
                              color = Color.Gray,
                              fontSize = 13.sp
                          )
                      }

                      IconButton(onClick = onAdd) {
                          Icon(
                              Icons.Default.Add,
                              contentDescription = "Add videos",
                              tint = Color.White
                          )
                      }
                  }

                  Spacer(Modifier.height(24.dp))

                  if (continueWatching.isNotEmpty()) {
                      Text(
                          "Continue Watching",
                          color = Color.White,
                          fontSize = 20.sp,
                          fontWeight = FontWeight.Bold
                      )
                      Spacer(Modifier.height(10.dp))

                      LazyColumn(
                          modifier = Modifier.heightIn(max = 220.dp)
                      ) {
                          items(continueWatching, key = { it.uri.toString() }) { video ->
                              VideoCard(
                                  video = video,
                                  resume = true,
                                  onPlay = { onPlay(video) },
                                  onRemove = { onRemove(video) }
                              )
                          }
                      }

                      Spacer(Modifier.height(20.dp))
                  }

                  Text(
                      "My Library",
                      color = Color.White,
                      fontSize = 20.sp,
                      fontWeight = FontWeight.Bold
                  )

                  Spacer(Modifier.height(10.dp))

                  if (library.isEmpty()) {
                      Box(
                          modifier = Modifier.fillMaxSize(),
                          contentAlignment = Alignment.Center
                      ) {
                          Column(horizontalAlignment = Alignment.CenterHorizontally) {
                              Text(
                                  "Your library is empty",
                                  color = Color.White,
                                  fontSize = 18.sp
                              )
                              Spacer(Modifier.height(8.dp))
                              Text(
                                  "Add videos from your device to get started.",
                                  color = Color.Gray
                              )
                              Spacer(Modifier.height(16.dp))
                              Button(onClick = onAdd) {
                                  Text("Add Videos")
                              }
                          }
                      }
                  } else {
                      LazyColumn(
                          verticalArrangement = Arrangement.spacedBy(10.dp)
                      ) {
                          items(library, key = { it.uri.toString() }) { video ->
                              VideoCard(
                                  video = video,
                                  resume = false,
                                  onPlay = { onPlay(video) },
                                  onRemove = { onRemove(video) }
                              )
                          }
                      }
                  }
              }
          }

          @Composable
          private fun VideoCard(
              video: VideoFile,
              resume: Boolean,
              onPlay: () -> Unit,
              onRemove: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxWidth()
                      .background(Color(0xFF1B1D22), RoundedCornerShape(14.dp))
                      .padding(14.dp)
              ) {
                  Row(
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Box(
                          modifier = Modifier
                              .size(52.dp)
                              .background(
                                  Color(0xFF30343B),
                                  RoundedCornerShape(10.dp)
                              ),
                          contentAlignment = Alignment.Center
                      ) {
                          Icon(
                              Icons.Default.PlayArrow,
                              contentDescription = null,
                              tint = Color.White
                          )
                      }

                      Spacer(Modifier.width(12.dp))

                      Column(modifier = Modifier.weight(1f)) {
                          Text(
                              video.name,
                              color = Color.White,
                              fontWeight = FontWeight.SemiBold,
                              maxLines = 2
                          )
                          if (resume) {
                              Text(
                                  "Resume from ${formatTime(video.position)}",
                                  color = Color.Gray,
                                  fontSize = 12.sp
                              )
                          } else {
                              Text(
                                  "Video",
                                  color = Color.Gray,
                                  fontSize = 12.sp
                              )
                          }
                      }

                      TextButton(onClick = onRemove) {
                          Text("Remove", color = Color.Gray)
                      }
                  }

                  if (resume && video.duration > 0L) {
                      Spacer(Modifier.height(10.dp))
                      LinearProgressIndicator(
                          progress = {
                              (video.position.toFloat() / video.duration)
                                  .coerceIn(0f, 1f)
                          },
                          modifier = Modifier.fillMaxWidth(),
                          color = Color(0xFF8AB4F8),
                          trackColor = Color.DarkGray
                      )
                  }

                  Spacer(Modifier.height(8.dp))

                  Button(
                      onClick = onPlay,
                      modifier = Modifier.fillMaxWidth()
                  ) {
                      Icon(Icons.Default.PlayArrow, contentDescription = null)
                      Spacer(Modifier.width(6.dp))
                      Text(if (resume) "Resume" else "Play")
                  }
              }
          }

          @Composable
          private fun PlayerScreen(
              video: VideoFile,
              player: ExoPlayer?,
              tracks: Tracks,
              audioOptions: List<TrackOption>,
              subtitleOptions: List<TrackOption>,
              currentPosition: Long,
              currentDuration: Long,
              isPlaying: Boolean,
              statusMessage: String,
              onBack: () -> Unit,
              onAudio: () -> Unit,
              onSubtitles: () -> Unit,
              onAddSubtitle: () -> Unit
          ) {
              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color.Black)
              ) {
                  Row(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(Color(0xFF151515))
                          .padding(horizontal = 8.dp, vertical = 4.dp),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      IconButton(onClick = onBack) {
                          Icon(
                              Icons.Default.ArrowBack,
                              contentDescription = "Back",
                              tint = Color.White
                          )
                      }

                      Text(
                          video.name,
                          color = Color.White,
                          modifier = Modifier.weight(1f),
                          maxLines = 1
                      )

                      IconButton(onClick = onAudio) {
                          Icon(
                              Icons.Default.Settings,
                              contentDescription = "Audio language",
                              tint = Color.White
                          )
                      }
                  }

                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f),
                      contentAlignment = Alignment.Center
                  ) {
                      if (player != null) {
                          key(player) {
                              AndroidView(
                                  factory = { ctx ->
                                      PlayerView(ctx).apply {
                                          layoutParams = ViewGroup.LayoutParams(
                                              ViewGroup.LayoutParams.MATCH_PARENT,
                                              ViewGroup.LayoutParams.MATCH_PARENT
                                          )
                                          this.player = player
                                          useController = true
                                          controllerAutoShow = true
                                          setShowSubtitleButton(true)
                                      }
                                  },
                                  update = { it.player = player },
                                  modifier = Modifier.fillMaxSize()
                              )
                          }
                      }
                  }

                  Column(
                      modifier = Modifier
                          .fillMaxWidth()
                          .background(Color(0xFF151515))
                          .padding(14.dp)
                  ) {
                      Text(
                          video.name,
                          color = Color.White,
                          fontWeight = FontWeight.Bold
                      )

                      Spacer(Modifier.height(5.dp))

                      Text(
                          "${formatTime(currentPosition)} / ${formatTime(currentDuration)}",
                          color = Color.Gray,
                          fontSize = 12.sp
                      )

                      Spacer(Modifier.height(12.dp))

                      Row(
                          modifier = Modifier.fillMaxWidth(),
                          horizontalArrangement = Arrangement.spacedBy(8.dp)
                      ) {
                          OutlinedButton(
                              onClick = onAudio,
                              modifier = Modifier.weight(1f)
                          ) {
                              Text("Audio (${audioOptions.size})")
                          }

                          OutlinedButton(
                              onClick = onSubtitles,
                              modifier = Modifier.weight(1f)
                          ) {
                              Text("Subtitles (${subtitleOptions.size})")
                          }
                      }

                      Spacer(Modifier.height(4.dp))

                      OutlinedButton(
                          onClick = onAddSubtitle,
                          modifier = Modifier.fillMaxWidth()
                      ) {
                          Text("Add external subtitle file")
                      }

                      if (statusMessage.isNotBlank()) {
                          Text(
                              statusMessage,
                              color = Color(0xFF8AB4F8),
                              fontSize = 12.sp
                          )
                      }
                  }
              }
          }

          @Composable
          private fun TrackDialog(
              title: String,
              options: List<TrackOption>,
              onDismiss: () -> Unit,
              onOff: (() -> Unit)?,
              onSelect: (TrackOption) -> Unit
          ) {
              AlertDialog(
                  onDismissRequest = onDismiss,
                  title = { Text(title) },
                  text = {
                      Column {
                          if (onOff != null) {
                              TextButton(
                                  onClick = onOff,
                                  modifier = Modifier.fillMaxWidth()
                              ) {
                                  Text("Off")
                              }
                          }

                          if (options.isEmpty()) {
                              Text(
                                  "No tracks were detected in this video.",
                                  color = Color.Gray
                              )
                          } else {
                              options.forEach { option ->
                                  Row(
                                      modifier = Modifier
                                          .fillMaxWidth()
                                          .clickable { onSelect(option) }
                                          .padding(vertical = 10.dp),
                                      verticalAlignment = Alignment.CenterVertically
                                  ) {
                                      RadioButton(
                                          selected = option.selected,
                                          onClick = { onSelect(option) }
                                      )
                                      Spacer(Modifier.width(8.dp))
                                      Text(option.title)
                                  }
                              }
                          }
                      }
                  },
                  confirmButton = {
                      TextButton(onClick = onDismiss) {
                          Text("Close")
                      }
                  }
              )
          }

          private fun getTrackOptions(
              tracks: Tracks,
              type: Int
          ): List<TrackOption> {
              val result = mutableListOf<TrackOption>()

              for (group in tracks.groups) {
                  if (group.type != type) continue

                  for (index in 0 until group.length) {
                      val format = group.getTrackFormat(index)
                      val language = format.language
                          ?.takeIf { it.isNotBlank() && it != "und" }
                          ?.let { Locale.forLanguageTag(it).getDisplayLanguage() }

                      val label = format.label
                          ?.takeIf { it.isNotBlank() }
                          ?: language
                          ?: when (type) {
                              C.TRACK_TYPE_AUDIO -> "Audio track ${index + 1}"
                              else -> "Subtitle track ${index + 1}"
                          }

                      result.add(
                          TrackOption(
                              title = label,
                              group = group,
                              index = index,
                              selected = group.isTrackSelected(index)
                          )
                      )
                  }
              }

              return result
          }

          private fun subtitleMimeType(
              name: String,
              context: Context,
              uri: Uri
          ): String {
              return when (name.substringAfterLast('.', "").lowercase()) {
                  "srt" -> MimeTypes.APPLICATION_SUBRIP
                  "vtt" -> MimeTypes.TEXT_VTT
                  "ass", "ssa" -> MimeTypes.TEXT_SSA
                  "ttml", "xml" -> MimeTypes.APPLICATION_TTML
                  else -> {
                      when (context.contentResolver.getType(uri)) {
                          "text/vtt" -> MimeTypes.TEXT_VTT
                          "application/ttml+xml" -> MimeTypes.APPLICATION_TTML
                          else -> MimeTypes.APPLICATION_SUBRIP
                      }
                  }
              }
          }

          private fun displayName(context: Context, uri: Uri): String {
              var name = uri.lastPathSegment ?: "Video"
              try {
                  context.contentResolver.query(
                      uri,
                      arrayOf(android.provider.OpenableColumns.DISPLAY_NAME),
                      null,
                      null,
                      null
                  )?.use { cursor ->
                      if (cursor.moveToFirst()) {
                          val index = cursor.getColumnIndex(
                              android.provider.OpenableColumns.DISPLAY_NAME
                          )
                          if (index >= 0) name = cursor.getString(index) ?: name
                      }
                  }
              } catch (_: Exception) {
              }
              return name
          }

          private fun loadLibrary(prefs: android.content.SharedPreferences): List<VideoFile> {
              val raw = prefs.getString("library", null) ?: return emptyList()
              return raw.split("\n").mapNotNull { line ->
                  val parts = line.split("|")
                  if (parts.size < 3) return@mapNotNull null
                  try {
                      VideoFile(
                          uri = Uri.parse(Uri.decode(parts[0])),
                          name = Uri.decode(parts[1]),
                          position = parts[2].toLongOrNull() ?: 0L,
                          duration = parts.getOrNull(3)?.toLongOrNull() ?: 0L
                      )
                  } catch (_: Exception) {
                      null
                  }
              }
          }

          private fun saveLibrary(
              prefs: android.content.SharedPreferences,
              library: List<VideoFile>
          ) {
              val raw = library.joinToString("\n") {
                  listOf(
                      Uri.encode(it.uri.toString()),
                      Uri.encode(it.name),
                      it.position.toString(),
                      it.duration.toString()
                  ).joinToString("|")
              }
              prefs.edit().putString("library", raw).apply()
          }

          private fun saveProgress(
              prefs: android.content.SharedPreferences,
              video: VideoFile?,
              position: Long,
              duration: Long
          ) {
              if (video == null) return

              val completed = duration > 0L &&
                  position >= duration * 0.92

              val savedPosition = if (completed) 0L else position.coerceAtLeast(0L)

              prefs.edit()
                  .putLong("position_${video.uri}", savedPosition)
                  .putLong("duration_${video.uri}", duration.coerceAtLeast(0L))
                  .apply()
          }

          private fun formatTime(ms: Long): String {
              if (ms <= 0L) return "00:00"
              val totalSeconds = ms / 1000
              val hours = totalSeconds / 3600
              val minutes = (totalSeconds % 3600) / 60
              val seconds = totalSeconds % 60

              return if (hours > 0) {
                  "%02d:%02d:%02d".format(hours, minutes, seconds)
              } else {
                  "%02d:%02d".format(minutes, seconds)
              }
          }
          EOF

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Infuse-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
